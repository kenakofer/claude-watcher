<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Claude Code session watcher</title>
<style>
  /* Palette roles. Light values first; dark steps are selected for the dark
     surface (not an automatic flip) and validated against it. */
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --plane: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --series-1: #2a78d6;  /* cache read   */
    --series-2: #eb6834;  /* cache write  */
    --series-3: #1baf7a;  /* output       */
    --series-4: #eda100;  /* input        */
    /* Cumulative-cost overlay. Deliberately outside the band palette so the
       line never reads as a fifth token type. */
    --cumulative: #7a4fd0;
    /* Money grid overlay. Shares the cumulative-cost hue because it encodes the
       same quantity — dollars — so the two money-denominated marks read as one
       family, and both stay outside the band palette so neither reads as a
       fifth token type.
       Separation from the line comes from the hairline stroke and the grid's
       regularity, not from muting the hue: the grid was previously toned down
       until it was invisible over the data. Light mode runs a shade darker than
       `--cumulative` for contrast against the light plane; dark mode matches
       the line exactly. */
    --money-grid: #5b32ab;
    /* Prompt-cache expiry markers. One hue for both TTLs: a 5m and a 1h lapse
       are the same event at different thresholds, so they are distinguished by
       dash pattern rather than color. Distinct from `--critical` because a
       compaction is something Claude Code did, while an expiry is just time
       passing — conflating them would imply a causal link that isn't there. */
    --cache-expiry: #0f8f8f;
    /* Quota squares. Yellow was asked for, but `--series-4` (input) is already
       amber, so this runs warmer and deeper to stay distinguishable from a
       token band — the quota panel encodes a budget, not a token type. Light
       mode darkens it for contrast against the light plane; a true yellow is
       unreadable there. */
    --quota: #b8860b;
    --good: #0ca30c;
    --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --plane: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --cumulative: #a687ea;
      --money-grid: #a687ea;
      --cache-expiry: #2fbdbd;
      --quota: #f2c14e;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --plane: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --cumulative: #a687ea;
    --money-grid: #a687ea;
    --cache-expiry: #2fbdbd;
    --quota: #f2c14e;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--plane);
    color: var(--text-primary);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; }

  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 20px 24px 12px;
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .live {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-secondary);
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--good); flex: none;
  }
  .dot.stale { background: var(--muted); }
  .spacer { margin-left: auto; }
  button.ghost {
    font: inherit; font-size: 12px; color: var(--text-secondary);
    background: transparent; border: 1px solid var(--border);
    border-radius: 7px; padding: 5px 10px; cursor: pointer;
  }
  button.ghost:hover { background: var(--surface-1); }

  main { padding: 0 24px 40px; display: grid; gap: 16px; }

  /* Sessions is first in the DOM so it lands at the top of the left column in
     the wide layout below. Single-column screens want the opposite order —
     the breakdown is the main view and the session list is the picker under
     it — so push Sessions to the end visually. `order` rather than moving the
     element back, because both layouts read from the same source order.

     Everything else keeps the default `order: 0` and so stays in DOM order
     ahead of it; only the one panel needs a rule. */
  @media (max-width: 1279.98px) {
    #sessions-card { order: 1; }
  }

  /* Wide screens: Sessions takes the whole left half and the breakdown fills
     the right half.

     Done by placing panels into an explicit two-column grid on `main` rather
     than by wrapping each side in a column div, because preserveScroll()
     anchors on `main > .panel` — a wrapper would hide every panel from that
     selector and break scroll preservation on live updates.

     Below 1280px nothing changes and the page stays as it was. */
  @media (min-width: 1280px) {
    main {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      align-items: start;
    }
    /* Sessions: left column, spanning every row the right column produces. */
    #sessions-card {
      grid-column: 1;
      grid-row: 1 / -1;
      /* Its own scroll region, so a long session list neither stretches the
         grid nor pushes the right column's charts off screen. Capped against
         the viewport rather than the sibling column: matching the right
         column's height would need JS, and the sticky top offset keeps the
         header clear. */
      position: sticky;
      top: 16px;
      max-height: calc(100vh - 32px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #sessions-card > .panel-body {
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    /* The table box scrolls in both directions here; .scroll is otherwise
       horizontal-only. */
    #sessions-card .scroll { overflow-y: auto; min-height: 0; }
    main > .panel:not(#sessions-card) { grid-column: 2; }

    /* The breakdown is the only panel in the right column, so it stretches to
       the height of the Sessions card beside it instead of sitting
       content-sized. `align-items: start` on main would otherwise size it to
       its content; the row is already the full grid height, so stretching into
       it needs no explicit height. Only when open — a collapsed <details> must
       stay at its summary height. */
       The max-height is what makes the measurement terminate: without a cap the
       card grows to fit whatever SVG was just drawn, that growth feeds back as
       more slack on the next render, and the chart ratchets taller each pass.
       Bounded by the viewport, as the Sessions card is. */
    #detail-card[open] {
      align-self: stretch;
      max-height: calc(100vh - 32px);
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* Stretches to the card so the chart has a real box to measure against;
       `align-items` stays at its stretch default, so rows keep full width. */
    #detail-card[open] > .panel-body {
      flex: 1;
      min-height: 0;
    }
  }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    min-width: 0;
  }
  .card h2 {
    font-size: 12px; font-weight: 600; margin: 0;
    color: var(--text-secondary); letter-spacing: 0.01em;
  }
  .card .sub { font-size: 12px; color: var(--muted); margin: 0 0 14px; }

  /* Session total as a headline, opposite the descriptive line. Baseline
     alignment, not centre: the two have very different type sizes, and sitting
     them on a shared baseline is what makes the pairing read as one row. The
     margin moves from .sub to the flex row so both children can be flush. */
  .detail-head {
    display: flex; align-items: baseline; gap: 16px;
    flex-wrap: wrap; margin: 0 0 14px;
  }
  .detail-head .sub { margin: 0; flex: 1 1 240px; }
  .detail-head .headline {
    margin: 0; margin-left: auto; text-align: right;
    font-size: 26px; font-weight: 600; line-height: 1.1;
    color: var(--text-primary); font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .detail-head .headline-label {
    display: block; font-size: 11px; font-weight: 500;
    color: var(--muted); letter-spacing: 0.02em;
    margin-top: 2px;
  }
  /* Pulled out of the legend, where it was one muted item among many and read
     as a series rather than as instructions for reading the plot. */
  .grid-note { margin: -8px 0 12px; }

  /* Collapsible panels. The whole header row is the toggle, with a rotating
     caret so the open/closed state is visible without relying on layout. */
  .panel > summary {
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; list-style: none; user-select: none;
    margin: -2px 0; padding: 2px 0; border-radius: 6px;
  }
  .panel > summary::-webkit-details-marker { display: none; }
  .panel > summary::before {
    content: ''; flex: none;
    width: 0; height: 0;
    border-left: 5px solid var(--muted);
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
    transition: transform .15s ease;
  }
  .panel[open] > summary::before { transform: rotate(90deg); }
  .panel > summary:hover h2 { color: var(--text-primary); }
  .panel > summary:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
  .panel-body { padding-top: 12px; }
  /* Nested table-view disclosures keep the default marker but stay recessive. */
  summary.minor { font-size: 12px; color: var(--text-secondary); cursor: pointer; }


  svg { display: block; width: 100%; overflow: visible; }
  /* The detail SVG carries no height attribute: the JS puts the height it laid
     the drawing out for into the viewBox and publishes it as this variable, so
     the element matches the geometry rather than scaling to fit. The fallback
     is the same 420px floor the JS uses, for the narrow layout. */
  #detail-chart svg { height: var(--detail-chart-h, 420px); }
  .grid-line { stroke: var(--grid); stroke-width: 1; }
  .axis-line { stroke: var(--axis); stroke-width: 1; }
  .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .axis-label { fill: var(--muted); font-size: 11px; }

  /* Legend — always present for >= 2 series */
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; }
  .legend .item { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
  .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  /* Line swatches for marks drawn as rules rather than filled bands. The
     dash pattern has to match what the chart draws, or the legend stops being
     a key and becomes a second, contradictory encoding. */
  .swatch.line {
    height: 0; border-radius: 0; width: 14px;
    border-top: 2px solid currentColor; align-self: center;
  }
  .swatch.line-5m { border-top-style: dotted; }
  .swatch.line-1h { border-top-style: dashed; }

  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:hover { background: var(--plane); }
  tbody tr.selected { background: var(--plane); }
  .scroll { overflow-x: auto; }
  .name { max-width: 225px; overflow: hidden; text-overflow: ellipsis; }

  .pill {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--text-secondary);
  }
  /* TTL pills reuse the cache-write series hue — the thing they describe — so
     a reader who has learned that color on the charts sees the same meaning
     here. 1h is the default and stays unaccented to keep the column quiet;
     only the non-default states earn ink. */
  .pill.ttl-1h { color: var(--muted); }
  .pill.ttl-5m,
  .pill.ttl-mixed {
    color: var(--series-2); border-color: var(--series-2);
  }
  .pill.ttl-mixed { border-style: dashed; }
  .muted { color: var(--muted); }
  details { margin-top: 12px; }
  summary { font-size: 12px; color: var(--text-secondary); cursor: pointer; }

  /* Tooltip: enhances, never gates — every value is also in a table view. */
  #tip {
    position: fixed; pointer-events: none; opacity: 0; transition: opacity .08s;
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; z-index: 50;
    box-shadow: 0 6px 20px rgba(0,0,0,.16); max-width: 280px;
  }
  #tip .t-title { font-weight: 600; margin-bottom: 4px; }
  #tip .t-row { display: flex; justify-content: space-between; gap: 14px; }
  /* Keep the label on one line so the value column stays aligned; the tooltip
     grows horizontally instead of wrapping a two-word label. */
  #tip .t-row span:first-child { white-space: nowrap; }
  #tip .t-row span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .modes { display: flex; gap: 8px; margin: 0 0 12px; align-items: center; }
  .modes button[aria-pressed="true"] {
    color: var(--text-primary);
    border-color: var(--text-secondary);
  }
  .modes button[disabled] { opacity: 0.4; cursor: default; }
  .modes button[disabled]:hover { background: transparent; }
  .modes button[data-zoom="in"], .modes button[data-zoom="out"] {
    font-size: 14px; line-height: 1; padding: 5px 11px;
  }
  .zoom-hint {
    font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  /* Drag-to-pan would otherwise select the axis labels mid-gesture. */
  #detail-chart svg { user-select: none; -webkit-user-select: none; touch-action: pan-y; }
</style>
</head>
<body>
<header>
  <h1>Claude Code session watcher</h1>
  <span class="live"><span class="dot" id="live-dot"></span><span id="live-text">connecting…</span></span>
  <span class="spacer"></span>
  <button class="ghost" id="theme-toggle" type="button">Theme</button>
</header>

<main>
  <!-- First in the DOM so the wide two-column layout puts it at the top of the
       left column; on narrow screens this also puts the session list above the
       breakdown it drives, which is the order you read them in. -->
  <details class="card panel" id="sessions-card" open>
    <summary><h2>Sessions</h2></summary>
    <div class="panel-body">
      <div class="scroll"><table id="sessions-table"></table></div>
    </div>
  </details>

  <details class="card panel" id="detail-card" open>
    <summary><h2 id="detail-title">Session breakdown</h2></summary>
    <div class="panel-body">
      <div class="detail-head">
        <p class="sub" id="detail-sub"></p>
        <p class="headline" id="detail-total"></p>
      </div>
      <p class="sub grid-note" id="detail-grid-note" hidden></p>
      <div class="modes" id="detail-modes">
        <button class="ghost" type="button" data-mode="absolute">Tokens per turn</button>
        <button class="ghost" type="button" data-mode="usage">Usage per turn</button>
        <button class="ghost" type="button" data-mode="cost">Cost per turn</button>
        <span class="spacer"></span>
        <span class="zoom-hint" id="detail-zoom-hint"></span>
        <button class="ghost" type="button" data-zoom="out" title="Zoom out">−</button>
        <button class="ghost" type="button" data-zoom="in" title="Zoom in">+</button>
        <button class="ghost" type="button" data-zoom="reset" title="Show all calls">Reset</button>
      </div>
      <div id="detail-chart"><p class="empty">Loading…</p></div>
      <div class="legend" id="detail-legend"></div>
      <details>
        <summary class="minor" id="detail-table-label">Table view — model calls (last 40)</summary>
        <div class="scroll"><table id="detail-table"></table></div>
      </details>
    </div>
  </details>

</main>

<div id="tip" role="status" aria-live="polite"></div>

<script type="module">
const SVG = 'http://www.w3.org/2000/svg';
const fmtUSD = (n) =>
  n >= 100 ? '$' + n.toFixed(0) : n >= 1 ? '$' + n.toFixed(2) : '$' + n.toFixed(3);
const fmtInt = (n) => n.toLocaleString('en-US');
// Axis ticks for per-call costs, which are typically fractions of a cent.
// Shows enough decimal places to keep adjacent ticks distinct.
const fmtAxisUSD = (n) => {
  if (n === 0) return '$0';
  if (n >= 1) return '$' + n.toFixed(n >= 10 ? 0 : 1);
  if (n >= 0.01) return '$' + n.toFixed(2);
  if (n >= 0.001) return '$' + n.toFixed(3);
  return '$' + n.toFixed(4);
};
// Precise per-call cost for tooltips and tables, where exactness matters more
// than compactness. fmtUSD rounds sub-cent values to zero.
const fmtExactUSD = (n) => (n === 0 ? '$0' : '$' + n.toFixed(n < 0.01 ? 5 : 4));
// Wall-clock time for a single call. Seconds are kept: consecutive calls in a
// session are often less than a minute apart, so minute precision would show
// several of them as the same instant.
const fmtClock = (iso) => {
  const d = new Date(iso);
  return Number.isNaN(d.getTime()) ? '—' : d.toLocaleTimeString();
};
// Time from the first call of the session, which is what makes a timestamp
// readable as a position in the session rather than a bare time of day.
const fmtElapsed = (ms) => {
  if (!Number.isFinite(ms) || ms < 0) return '';
  const s = Math.round(ms / 1000);
  if (s < 60) return `${s}s`;
  const mins = Math.floor(s / 60);
  if (mins < 60) return `${mins}m ${s % 60}s`;
  const hrs = Math.floor(mins / 60);
  return `${hrs}h ${mins % 60}m`;
};
const compact = (n) => {
  const abs = Math.abs(n);
  if (abs >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (abs >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (abs >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return String(n);
};

// Stack order for the per-session token chart, bottom band first. Cache read is
// the largest and sits on the baseline so the smaller bands stay readable above
// it. Color follows the entity — never reassigned by rank — so a token type
// keeps its hue as data changes.
//
// `quota` is the band's weight in output-token equivalents, and it is what
// usage mode stacks. Cache read and input weigh zero — the 5-hour meter does
// not charge them — so in that mode those bands are simply absent, and the
// stack height is the same quantity the running total and the 1% grid use. The
// weights are filled in below, once the quota constants are defined.
const STACK = [
  { token: 'cacheReadTokens',     cost: 'cacheRead',  label: 'Cache read',  color: 'var(--series-1)' },
  { token: 'cacheCreationTokens', cost: 'cacheWrite', label: 'Cache write', color: 'var(--series-2)' },
  { token: 'inputTokens',         cost: 'input',      label: 'Input',       color: 'var(--series-4)' },
  { token: 'outputTokens',        cost: 'output',     label: 'Output',      color: 'var(--series-3)' },
];

// --- Quota unit -------------------------------------------------------------
//
// OUTPUT tokens per 1% of a rolling 5-hour window, measured rather than assumed.
//
// The 5-hour meter tracks output tokens, not total throughput. That is the
// single most surprising thing in this file, so the evidence is worth stating.
//
// Measured over a window with real boundaries (the statusline's
// `rate_limits.resets_at`, which this dashboard cannot see — the figure comes
// from a separate measurement, not from anything in the transcripts), starting
// from a true 0% with exactly one session running and complete transcripts:
//
//   fit on the 1-19% range, then extrapolate to 40%   -> mean error
//     output tokens                                      3.4%
//     total tokens                                      13.4%
//     API duration                                      43.6%
//
//   predicting the window's final meter reading from transcripts alone:
//     output tokens (this constant)   43.6% vs 41% actual   ->  6.5% error
//     total tokens (previous model)   15.1% vs 41% actual   -> 63.3% error
//
// Cross-checked on a second, messier window (two concurrent sessions, unknown
// starting offset, so deltas only, 57 points spanned): 2,345 output tokens per
// point against the clean window's 2,549 — 8% apart, where the total-token
// model disagreed with itself by 90% between the same two windows. A quantity
// that is stable across windows is a unit; one that doubles is not.
//
// CACHE WRITES COUNT TOO, at about 1/8 of an output token:
//
//   1 point ~= 3,500 output tokens, OR ~29,000 cache-write tokens
//
// This was missed until a cache miss made it visible. Ordinary turns write only
// ~1k cache tokens against ~500 output, so the cache-write term is a rounding
// error and an output-only model fits fine. A cache *miss* re-sends the whole
// context as one large cache write: 172k tokens in a single call, which moved
// the meter 58% -> 66% while output-only predicted ~1 point. Wrong by ~8x, and
// only detectable because the event puts the two regressors far out of their
// usual ratio.
//
// The two-term model passes everything the one-term model failed:
//   - holdout (fit 1-36%, predict 37-66%): MAPE 0.99% vs 2.58% for output-only
//   - bootstrap 95% CI on the cache-write coefficient [3.11e-5, 3.87e-5],
//     P(<0) = 0.0000
//
// Cache READ is still out. In a three-term fit it lands at 1 point per ~34M
// tokens and improves MAPE by 0.03pp — indistinguishable from zero. Earlier
// attempts to find it produced a coefficient whose bootstrap CI straddled zero
// and which made holdout prediction *worse*; that was noise. It is bounded
// below roughly 1/1000 of an output token, not proven to be exactly zero.
//
// Accuracy is ~+/-5% now, but do not over-tune: the meter reports whole
// percent, so one point already carries +/-0.5 of quantization. Constants have
// moved twice as the window grew (2,428 at 41% -> 2,700 at 56% -> 3,501 with
// the cache-write term), so re-check rather than trusting them indefinitely.
//
// Why the old total-token model looked right for so long: cache read is
// 94-99.5% of every turn and scales with output over a long session, so
// `total` and `output` correlate strongly *within* one window. They diverge
// across windows with different context sizes, which is exactly where the old
// constant broke. Do not re-derive this from total tokens; the correlation is
// real but it is not causal.
//
// Compaction needs NO separate term. Across the one compaction in the clean
// window the model's residual *improved* (-3.40 -> -0.81 points): the meter did
// not jump. Compaction is billed as input, and input is not what is metered.
// It is still quota-heavy per event, because generating a ~10k-token summary is
// ~30x a median turn's output.
//
// MEASURED ON OPUS 5 ONLY. Every window in the sample was Opus traffic, so this
// constant is really "per Opus output token" and the mode says so. Two ways it
// could differ elsewhere, which the data cannot distinguish:
//
//  - If the meter counts raw output tokens, this constant is universal.
//  - If it counts *cost* denominated in output-equivalents, cheaper models
//    should consume more slowly (Opus output is ~5x Sonnet), and on a model with
//    a different input:output price ratio the input term may stop being
//    negligible — the claim "input does not count" was verified only where
//    input is 94-99.5% cache read at Opus rates.
//
// To settle it: run a window with substantial Sonnet traffic and fit the same
// way (low range, extrapolate high). Landing near 3,500 means raw tokens;
// landing ~5x higher means cost.
const QUOTA_OUTPUT_TOKENS_PER_PERCENT = 3_501;
const QUOTA_CACHE_WRITE_TOKENS_PER_PERCENT = 28_957;

// Quota cost of one call, in percent of a 5-hour window. Output dominates on
// ordinary turns; the cache-write term only matters on cache misses and
// compaction, which is exactly where it matters most.
const quotaPctOf = (outputTokens, cacheWriteTokens) =>
  (outputTokens || 0) / QUOTA_OUTPUT_TOKENS_PER_PERCENT
  + (cacheWriteTokens || 0) / QUOTA_CACHE_WRITE_TOKENS_PER_PERCENT;

// Expressed in output-token equivalents, so the chart can keep a single linear
// axis and one grid unit. 1% of a window = QUOTA_OUTPUT_TOKENS_PER_PERCENT of
// these, whatever mix of output and cache write produced them.
const quotaEquivOf = (outputTokens, cacheWriteTokens) =>
  (outputTokens || 0)
  + (cacheWriteTokens || 0)
    * (QUOTA_OUTPUT_TOKENS_PER_PERCENT / QUOTA_CACHE_WRITE_TOKENS_PER_PERCENT);

// Per-band quota weights, in output-token equivalents per raw token. Derived
// from the same two constants as quotaEquivOf, so a band's height and the
// point's `usageTotal` cannot drift apart.
const QUOTA_WEIGHTS = {
  cacheReadTokens: 0,
  inputTokens: 0,
  outputTokens: 1,
  cacheCreationTokens:
    QUOTA_OUTPUT_TOKENS_PER_PERCENT / QUOTA_CACHE_WRITE_TOKENS_PER_PERCENT,
};
for (const s of STACK) s.quota = QUOTA_WEIGHTS[s.token] || 0;

// The model the constant was calibrated against. Shown wherever the unit is,
// so a Sonnet session does not silently inherit an Opus-derived figure.
const QUOTA_CALIBRATION_MODEL = 'claude-opus-5';

const QUOTA_CALIBRATION_LABEL = 'Opus 5';

// Names the calibration, and warns when the session being plotted did not run
// on it. A quiet "calibrated on Opus 5" is enough when that is what you ran;
// when it is not, the reader needs to know the numbers are borrowed rather than
// measured. Keyed on the model that produced most of the session's output,
// since that is the model the figure is most wrong about. Labels come from the
// events (`modelLabel`), which is where the dashboard gets every other model
// name — the raw id is only used for the equality test.
function quotaCalibrationNote(pts) {
  const byModel = {};
  for (const p of pts) {
    if (p.compaction || !p.e.model) continue;
    const b = byModel[p.e.model] || { tokens: 0, label: p.e.modelLabel || p.e.model };
    b.tokens += p.usageTotal;
    byModel[p.e.model] = b;
  }
  const ranked = Object.entries(byModel).sort((a, b) => b[1].tokens - a[1].tokens);
  if (!ranked.length || ranked[0][0] === QUOTA_CALIBRATION_MODEL) {
    return `Calibrated on ${QUOTA_CALIBRATION_LABEL}.`;
  }
  return `Calibrated on ${QUOTA_CALIBRATION_LABEL}, but this session ran mostly on `
    + `${ranked[0][1].label} — the per-percent unit has not been measured there, `
    + 'so treat these percentages as indicative only.';
}

// Usage mode plots output tokens only — not the full stack the token view
// shows. A cache read is pushed through the model but does not move the 5-hour
// meter, so counting it here would be measuring the wrong thing (and did: the
// previous unweighted-total unit was off by 63%).

// Classify a session by the TTL of its cache writes.
//
// Claude Code writes 1h-TTL cache entries by default; FORCE_PROMPT_CACHING_5M=1
// forces the short TTL for the whole session. That choice is never recorded in
// the transcript as a setting, but it is fully visible in the billing split, so
// the mix is the only available evidence of how a session was launched.
//
// Deliberately reported as a share rather than a verdict: a resumed session can
// legitimately carry both (the pre-resume calls keep whatever TTL they were
// written under), so a hard "this session was 5m" label would be wrong for the
// mixed case. `mixed` is a real state, not an error.
function cacheTtl(totals) {
  const h1 = totals.cacheCreation1h || 0;
  const m5 = totals.cacheCreation5m || 0;
  const total = h1 + m5;
  if (!total) return { kind: 'none', label: '—', title: 'No cache writes recorded.' };
  const share5m = m5 / total;
  const pct = (x) => (x * 100).toFixed(x > 0 && x < 0.01 ? 1 : 0) + '%';
  const detail =
    `${compact(m5)} tok at 5m (${pct(share5m)}), ` +
    `${compact(h1)} tok at 1h (${pct(1 - share5m)}). ` +
    'Cache writes bill at 1.25x input for 5m, 2x for 1h.';
  // Thresholds, not equality: a handful of stray tokens from the other TTL
  // shouldn't demote an otherwise clean session to "mixed".
  if (share5m >= 0.99) return { kind: '5m', label: '5m', title: `Short TTL throughout. ${detail}` };
  if (share5m <= 0.01) return { kind: '1h', label: '1h', title: `Default 1h TTL. ${detail}` };
  return { kind: 'mixed', label: `mixed ${pct(share5m)}`, title: `Both TTLs present. ${detail}` };
}

const el = (id) => document.getElementById(id);
const tip = el('tip');

function showTip(evt, title, rows) {
  tip.innerHTML =
    `<div class="t-title">${title}</div>` +
    rows.map(([k, v]) => `<div class="t-row"><span>${k}</span><span>${v}</span></div>`).join('');
  tip.style.opacity = '1';
  const pad = 14;
  const rect = tip.getBoundingClientRect();
  let x = evt.clientX + pad;
  let y = evt.clientY + pad;
  if (x + rect.width > innerWidth - 8) x = evt.clientX - rect.width - pad;
  if (y + rect.height > innerHeight - 8) y = evt.clientY - rect.height - pad;
  tip.style.left = Math.max(8, x) + 'px';
  tip.style.top = Math.max(8, y) + 'px';
}
const hideTip = () => { tip.style.opacity = '0'; };

function svgEl(tag, attrs = {}) {
  const node = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
}

// --- Stable updates ---------------------------------------------------------
//
// A live SSE batch re-renders everything, which used to shove the page around
// under anyone reading it. Two separate causes, one helper each.
//
// 1. Emptying a chart host before refilling it collapses the element to zero
//    height for the duration. The document shrinks, the browser clamps
//    scrollTop to the new maximum, and refilling does NOT restore it — so the
//    page creeps upward on every update. Swapping the content in a single
//    replaceChildren() never yields a zero-height intermediate state.
//
// 2. Replacing a table's innerHTML resets the horizontal scroll of its `.scroll`
//    container, throwing away a sideways scroll mid-read.
//
// The vertical position also has to survive genuine height changes — a new
// model bar, a new session row — which no swap can avoid. `preserveScroll`
// pins the viewport against the document's own growth above it.

// Replace a host's children in one operation, so it is never transiently empty.
const setChildren = (host, ...nodes) => host.replaceChildren(...nodes);

// The empty-state paragraph every chart falls back to, as a node rather than a
// string so it can go through the same single-swap path.
const emptyNote = (text) => {
  const p = document.createElement('p');
  p.className = 'empty';
  p.textContent = text;
  return p;
};

// Set a table's HTML while keeping its horizontal scroll offset.
function setTableHTML(table, html) {
  const box = table.closest('.scroll');
  const left = box ? box.scrollLeft : 0;
  table.innerHTML = html;
  // Restore only when it can still be honoured; a table that got narrower
  // clamps on its own rather than snapping to a stale offset.
  if (box && left) box.scrollLeft = Math.min(left, box.scrollWidth - box.clientWidth);
}

// Run a re-render that may change the document's height, holding the viewport
// still relative to the content the user is looking at.
//
// Anchored on the first element still visible at the top of the viewport rather
// than on scrollY: content growing *above* the anchor (a new session row, a new
// model bar) would otherwise push everything below it down by that height. The
// anchor moves with its content, so the correction is exactly the drift.
function preserveScroll(render) {
  // Nothing to preserve at the very top, and holding position there would fight
  // the natural "stay at the top" reading of a live feed.
  if (scrollY <= 0) { render(); return; }
  // Panels alone are too coarse: inside a tall one, the panel's own top edge is
  // far above the viewport and cannot report drift. Table rows carry a stable
  // identity across re-renders, so they anchor the inside of a panel too.
  const anchors = document.querySelectorAll('main > .panel, tr[data-id]');
  let anchor = null;
  for (const node of anchors) {
    const top = node.getBoundingClientRect().top;
    // Topmost element whose top edge is at or below the viewport top. Chosen by
    // measured position rather than by taking the first match in DOM order: the
    // narrow layout gives #sessions-card `order: 1`, so DOM order and visual
    // order differ, and stopping at the first match would anchor on a panel far
    // below the viewport whenever the user has scrolled past the breakdown.
    if (top >= 0 && (!anchor || top < anchor.top)) {
      anchor = { node, top, id: node.dataset && node.dataset.id };
    }
  }
  render();
  if (!anchor) return;
  // A row anchor is replaced wholesale by innerHTML, so re-find it by id; a
  // panel is the same node throughout. If the anchor is gone entirely (its
  // session dropped out of the list) there is no meaningful correction.
  const after = anchor.id
    ? document.querySelector(`tr[data-id="${CSS.escape(anchor.id)}"]`)
    : anchor.node;
  if (!after) return;
  const delta = after.getBoundingClientRect().top - anchor.top;
  if (delta) scrollBy(0, delta);
}

// Ticks at round intervals covering [0, max].
//
// `cover` extends the top tick to at or above `max`, so the axis actually
// contains the data. Without it the highest tick sits *below* the peak and
// anything above it is flattened against the ceiling — on a 537K-token
// session that silently hid 25% of the range.
function niceTicks(max, count = 4, cover = false) {
  if (max <= 0) return [0];
  const raw = max / count;
  const mag = 10 ** Math.floor(Math.log10(raw));
  const norm = raw / mag;
  const step = (norm >= 5 ? 10 : norm >= 2 ? 5 : norm >= 1 ? 2 : 1) * mag;
  const ticks = [];
  const limit = cover ? Math.ceil(max / step) * step : max * 1.0001;
  for (let v = 0; v <= limit + step * 1e-9; v += step) ticks.push(v);
  return ticks;
}

// A call gets its own column while its band is at least this wide: each call is
// a real event, and at this density a bar per call is both readable and honest
// about that. Below it the bar is thinner than the BAR_GAP that separates it
// from its neighbour, so the columns read as noise and the stacked area reads
// better as a trend.
//
// This is a pixel width, not a call count, because that is the quantity the
// legibility actually depends on: the same 400 calls are comfortable columns in
// a wide window and a grey smear in a narrow one. A count threshold picks one
// window width and is wrong at every other.
const MIN_BAR_BAND_PX = 5;

// Never zoom in past this many calls: below it the columns are wide enough
// that further zoom just adds whitespace without revealing anything.
const MIN_ZOOM_CALLS = 4;

// --- Outlier folding (usage mode) -------------------------------------------
//
// A single turn can draw 30x the median — one re-cache of a huge context, or a
// long generation — which on a shared axis flattens every ordinary turn onto the
// baseline. Clipping is not available here: usage mode's contract is that a
// bar's *area* is its quota draw, and clipping destroys area silently.
//
// So a tall turn is folded into N equal slices laid side by side, each 1/N as
// tall. Width x height is unchanged, so the ink is exactly conserved and the
// money grid still reads true — the bar is rewrapped, not rescaled.
//
// Fold only when the peak exceeds the median by this much; below it the session
// has no outlier to correct and folding would be noise.
const FOLD_TRIGGER = 3;
// Where the axis ceiling lands, as a multiple of the median. Same number as the
// trigger, so any turn that qualifies as an outlier is also one that folds at
// least in two, and there is no band of turns that trip the trigger but then sit
// under the ceiling unfolded.
const FOLD_HEADROOM = 3;
// A fold this deep is a smear rather than a bar. Past it the turn keeps its true
// height and is allowed to run off the top: at 12+ slices the column is so wide
// it stops reading as one turn, and an honest overflow beats an unreadable one.
// Disclosed in the legend when it happens.
const FOLD_MAX = 12;

// Clamp a proposed window to the data and to the minimum span, keeping it
// inside [0, n]. Returns null for "the whole range", so the un-zoomed state has
// exactly one representation and the reset button can rely on it.
function clampZoom(range, n) {
  if (!range) return null;
  let { start, end } = range;
  const minSpan = Math.min(MIN_ZOOM_CALLS, n);
  if (end - start < minSpan) {
    // Grow around the middle, then push back inside the bounds below.
    const mid = (start + end) / 2;
    start = mid - minSpan / 2;
    end = start + minSpan;
  }
  start = Math.round(start);
  end = Math.round(end);
  if (start < 0) { end -= start; start = 0; }
  if (end > n) { start -= end - n; end = n; }
  start = Math.max(0, start);
  if (end - start >= n) return null;
  return { start, end };
}

// Number of plotted calls in the currently loaded session — the denominator
// the zoom buttons clamp against, without re-deriving the whole point list.
function detailCallCount() {
  if (!detailData) return 0;
  return detailData.events.filter((e) => e.kind === 'chat_completion' && e.timestamp).length;
}

// The session total, moved out of the descriptive line and into the headline so
// it isn't the one number you have to read a sentence to find. It stays
// labelled because a bare figure at this size could be read as a rate or a
// budget rather than what this session has spent.
//
// Usage mode reports the whole session's quota draw, in the same unit as the
// chart below it. That can exceed 100%: a long session straddles window resets,
// and where those boundaries fall is not in the transcript. The honest reading
// is "this much of a window's worth of quota", not "this fraction of your
// current limit" — the short label can't carry that, so the scope and the
// over-100% case live in the tooltip.
//
// `usageEquiv` is in output-token equivalents, which only the caller that has
// weighted every call can supply.
function setHeadline(session, usageEquiv) {
  el('detail-total').innerHTML = detailMode === 'usage'
    ? `${(usageEquiv / QUOTA_OUTPUT_TOKENS_PER_PERCENT).toFixed(1)}%` +
      '<span class="headline-label" title="Output plus cache write across the ' +
      'whole session, in percent of a 5-hour window. A long session straddles ' +
      'window resets, so this can exceed 100%.">of 5hr. window</span>'
    : `${fmtUSD(session.totals.cost)}<span class="headline-label">session total</span>`;
}

// --- Stacked columns / area: context window over a session ------------------
function renderSessionDetail(session, events) {
  detailData = { session, events };
  for (const b of el('detail-modes').querySelectorAll('button[data-mode]')) {
    b.setAttribute('aria-pressed', String(b.dataset.mode === detailMode));
  }
  el('detail-title').textContent =
    `Session breakdown: ${session.title || session.sessionId.slice(0, 8)}`;
  const started = session.firstTimestamp ? new Date(session.firstTimestamp).toLocaleString() : '—';
  const ttl = cacheTtl(session.totals);
  const ttlNote = ttl.kind === 'none' ? '' : ` · ${ttl.label} cache TTL`;
  // Cost mode carries no caption: the mode buttons and the dollar axis already
  // say what is plotted. Token mode keeps one clause, because "the stack height
  // is the context window" is a reading of the geometry you can't get from the
  // axis alone.
  el('detail-sub').textContent =
    `${session.project || 'unknown project'} · started ${started} · ` +
    `${fmtInt(session.totals.calls)} calls${ttlNote}` +
    (detailMode === 'cost'
      ? ''
      : detailMode === 'usage'
        ? ' — percent of the 5-hour window per turn; only output and cache write are metered.'
        : ' — tokens per turn, stacked; the stack height is the context window.');
  // The headline is set once the points are built, below: in usage mode it
  // reports quota, which is only known after every call has been weighted.

  // Sort by timestamp rather than trusting ingest order. A resumed session's
  // transcript can append entries out of chronological order (and subagent
  // files are ingested whole), so plotting in file order would misplace both
  // the trend and the compaction boundaries against it.
  const calls = events
    .filter((e) => e.kind === 'chat_completion' && e.timestamp)
    .sort((a, b) => a.timestamp.localeCompare(b.timestamp));
  const host = el('detail-chart');
  // The note outlives the chart it describes, so this path has to clear it
  // explicitly — otherwise the previous session's grid square is left pointing
  // at an empty panel.
  if (!calls.length) {
    el('detail-grid-note').hidden = true;
    setChildren(host, emptyNote('No model calls in this session.'));
    // The headline is normally set once the points are weighted, which this
    // path never reaches — without this it would keep displaying the previously
    // selected session's total next to an empty chart.
    setHeadline(session, 0);
    return;
  }

  const usageMode = detailMode === 'usage';

  // Compactions as first-class points in usage mode.
  //
  // A compaction is billed but has no `usage` record, so it is invisible to
  // every per-call total in this file. In token and cost mode that is correct —
  // there is no stack and no priced breakdown to draw. In usage mode it is a
  // real omission: the summarization call re-reads the whole context, and on a
  // busy session compactions are a few percent of everything metered.
  //
  // The counts come from `compactMetadata` on the boundary event
  // (`preTokens` = context summarized, `postTokens` = summary produced), which
  // is the only place they are recorded locally.
  const compactionPoints = usageMode
    ? events
        .filter((e) => e.kind === 'compaction' && e.timestamp && (e.preTokens || e.postTokens))
        .sort((a, b) => a.timestamp.localeCompare(b.timestamp))
    : [];

  // Each call's four token types, stacked. The stack total is the prompt the
  // model actually saw, so the band inflates turn over turn as context grows
  // and drops hard at a compaction — and because the types are stacked rather
  // than summed into one line, you can also see the composition change there
  // (cache read collapses; cache write spikes as the summary is re-cached).
  //
  // Usage mode interleaves compaction bars into the same series, ordered by
  // timestamp alongside the calls, so the x axis stays chronological and the
  // cumulative line steps up where the compaction actually happened.
  const series = usageMode
    ? [...calls.map((e) => ({ e, compaction: false })),
       ...compactionPoints.map((e) => ({ e, compaction: true }))]
        .sort((a, b) => a.e.timestamp.localeCompare(b.e.timestamp))
    : calls.map((e) => ({ e, compaction: false }));

  let running = 0;
  let runningUsage = 0;
  const allPoints = series.map(({ e, compaction }, i) => {
    // A compaction has no token-type breakdown, so its bar is a single band in
    // its own colour rather than a stack. Zero-filling `parts` keeps every
    // downstream consumer (bars, legend, table, tooltip) on one shape.
    const parts = compaction
      ? STACK.map(() => 0)
      : STACK.map((s) => e.usage[s.token] || 0);
    const costs = compaction
      ? STACK.map(() => 0)
      : STACK.map((s) => (e.cost && e.cost[s.cost]) || 0);
    const costTotal = costs.reduce((a, b) => a + b, 0);
    // The same bands weighted by what the 5-hour meter actually charges. Cache
    // read and input weigh zero, so those bands vanish in usage mode instead of
    // burying the two that count — see QUOTA_WEIGHTS.
    const quotas = parts.map((v, si) => v * STACK[si].quota);
    // The call's quota draw, in output-token equivalents — see
    // QUOTA_OUTPUT_TOKENS_PER_PERCENT. Only output and cache write contribute;
    // the zero-weight bands drop out of the sum on their own.
    //
    // A compaction contributes ZERO here, which looks wrong and is not. Writing
    // the summary into a fresh cache shows up as a large `cacheCreationTokens`
    // on the *next ordinary call* — verified on 60 compactions, where the next
    // call's cache write covers `postTokens` 85% of the time. Charging the
    // boundary event as well would count the same tokens twice: over this
    // window, calls alone predict 68.6% against an actual 68%, and adding
    // `postTokens` pushes it to 69.0%.
    //
    // The event is still drawn — a compaction is worth seeing — but as a
    // full-height dashed marker rather than a bar, because it is an occasion,
    // not a quantity, and it must stay out of the running total. Its true cost
    // is visible in the spike on the call after it.
    //
    // Summed from `quotas` rather than computed alongside it, so the drawn
    // stack height and the running total are the same number by construction.
    const usageTotal = quotas.reduce((a, b) => a + b, 0);
    // Accumulated from the first call of the session, not the first visible
    // one: "spent so far" is a property of the session, so zooming into a
    // later window must not restart the total at zero.
    running += costTotal;
    runningUsage += usageTotal;
    return {
      i,
      parts,
      costs,
      quotas,
      compaction,
      ctx: compaction
        ? 0
        : e.usage.inputTokens + e.usage.cacheReadTokens + e.usage.cacheCreationTokens,
      total: compaction ? 0 : parts.reduce((a, b) => a + b, 0),
      usageTotal,
      costTotal,
      cum: running,
      cumUsage: runningUsage,
      e,
    };
  });

  setHeadline(session, runningUsage);

  // The zoom window is re-clamped against this session's length on every
  // render, so a stale range from a longer session (or one invalidated by new
  // calls streaming in) collapses to a valid one instead of drawing nothing.
  detailZoom = clampZoom(detailZoom, allPoints.length);
  const view = detailZoom || { start: 0, end: allPoints.length };
  // Everything below works on the visible slice, so the bar/area choice,
  // tooltips and markers all follow the zoom without special-casing it. Each
  // point keeps its original index in `p.i` for labelling.
  const points = allPoints.slice(view.start, view.end);

  // Zoom controls reflect the clamped window, so the buttons grey out exactly
  // when they'd be no-ops rather than on a guess about the range.
  const zoomControls = el('detail-modes');
  const atMin = view.end - view.start <= Math.min(MIN_ZOOM_CALLS, allPoints.length);
  for (const b of zoomControls.querySelectorAll('button[data-zoom]')) {
    const kind = b.dataset.zoom;
    b.disabled = kind === 'in' ? atMin : !detailZoom;
  }
  el('detail-zoom-hint').textContent = detailZoom
    ? `${fmtInt(view.end - view.start)} of ${fmtInt(allPoints.length)} calls`
    : (allPoints.length > MIN_ZOOM_CALLS ? 'scroll to zoom' : '');

  // Two readings of the same stack:
  //
  //  - tokens: the stack height is the context window, so it shows the sawtooth
  //    (context inflating turn over turn, dropping at a compaction). Cache read
  //    is ~99% of a turn, so the other bands are near-invisible here.
  //  - cost: each band is scaled by what that token type actually costs, so
  //    area is money. This is not a normalization trick — an output token is
  //    50x the price of a cache-read token on Opus, so the expensive-but-thin
  //    bands rise into view on their own merits, and the chart answers "where
  //    did the money go" rather than "where did the tokens go".
  //  - usage: OUTPUT tokens only, read as *area* rather than height, and with
  //    compactions added. Not the same quantity as the token view: the 5-hour
  //    meter tracks generation, not throughput, so cache reads are excluded
  //    entirely even though they dominate every other view — see
  //    QUOTA_OUTPUT_TOKENS_PER_PERCENT.
  const costMode = detailMode === 'cost';

  const W = Math.max(host.clientWidth || 720, 320);
  // 420 unless the wide layout has given the card a taller box to fill: there
  // the breakdown is the only panel in the right column and stretches to the
  // sessions list beside it, so the chart takes whatever height is left over.
  //
  // Measured against the *viewport*, never against any ancestor's current
  // height. Every box between here and <main> is content-sized — each one is as
  // tall as the SVG the last render drew — so subtracting siblings from a
  // parent's height returns "the old chart plus slack" and the chart grows by
  // that slack on every single render. The viewport is the one height in this
  // chain that a render cannot change.
  // Margins included: getBoundingClientRect() leaves them out, and these rows
  // carry a dozen-odd pixels each (.legend, .modes, .grid-note) — enough that
  // omitting them overshoots the viewport by ~100px.
  const used = [...host.parentElement.children]
    .filter((c) => c !== host)
    .reduce((a, c) => {
      const s = getComputedStyle(c);
      return a + c.getBoundingClientRect().height
        + parseFloat(s.marginTop) + parseFloat(s.marginBottom);
    }, 0);
  // The card is capped at calc(100vh - 32px) by the wide layout. Its remaining
  // chrome is measured rather than assumed — the summary row plus the card and
  // body padding, none of which depend on the drawing, so measuring them cannot
  // feed the sizing loop the way reading a content height would.
  const card = el('detail-card');
  const summary = card.querySelector(':scope > summary');
  const cs = getComputedStyle(card);
  const bs = getComputedStyle(host.parentElement);
  const chrome = summary.getBoundingClientRect().height
    + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom)
    + parseFloat(cs.borderTopWidth) + parseFloat(cs.borderBottomWidth)
    + parseFloat(bs.paddingTop) + parseFloat(bs.paddingBottom);
  const H = Math.max(Math.floor(innerHeight - 32 - chrome - used), 420);
  host.style.setProperty('--detail-chart-h', `${H}px`);
  // Right margin holds the cumulative-cost axis labels.
  const m = { top: 16, right: 56, bottom: 30, left: costMode ? 68 : 62 };
  const plotW = W - m.left - m.right;
  const plotH = H - m.top - m.bottom;
  // A single re-cache of a large context can cost 30x the median call, which
  // would flatten every other call into the baseline. Clip the cost axis to a
  // high percentile so the typical range stays readable; calls above the clip
  // are drawn to the top and tagged so nothing is silently hidden. The token
  // axis needs no clipping — the context window has a natural ceiling.
  const costValues = points.map((p) => p.costTotal).sort((a, b) => a - b);
  const p98 = costValues[Math.min(costValues.length - 1, Math.floor(costValues.length * 0.98))];
  const costMax = Math.max(costValues[costValues.length - 1] || 0, 1e-6);
  // Only clip when it actually buys headroom, and never below a real p98.
  const costCeiling = costMax > p98 * 3 && p98 > 0 ? p98 * 1.15 : costMax;
  const clipped = costMode ? points.filter((p) => p.costTotal > costCeiling).length : 0;

  // Headroom so the peak sits below the top gridline instead of against the
  // frame, and `cover` so the top tick is at or above the data — otherwise the
  // highest values get flattened by the y() clamp below.
  // Usage does NOT clip. Clipping is right for cost — the y axis there is a
  // rate and a clipped bar still reads as "off the top" — but usage mode's
  // contract is that *area is quota*, and a clipped bar silently destroys area.
  //
  // Instead it *folds*: a turn taller than the ceiling is drawn as N side-by-side
  // slices of one Nth the height, so the ink is conserved exactly and the bar
  // still says "this much quota" — it just says it wide instead of tall. Each
  // slice carries a "1 of N" label so the fold is declared rather than implied.
  //
  // This is not the old spread/cap machinery, which widened a bar *around its own
  // centre* and so overlapped its neighbours; it needed a cap, and a capped bar
  // under-drew its area — the one thing this mode promises not to do. Folding
  // consumes real slots instead (see `slots` below), so nothing overlaps, nothing
  // is capped, and area survives at any fold depth.
  //
  // The ceiling is a robust typical value, not the max: the whole point is that
  // one 30x turn must not set the scale. Median x 3 rather than mean x 3 — a few
  // outliers drag a mean upward by exactly the amount being corrected for, so a
  // mean-based ceiling rises to meet the outlier and folds nothing. The median is
  // unmoved by them, which is the property wanted here.
  //
  // Floors at a real p98 so an all-similar session doesn't fold on noise: if the
  // 98th percentile already sits under median x 3, nothing is an outlier and the
  // scale is left alone.
  const usageSorted = points.map((p) => p.usageTotal).sort((a, b) => a - b);
  const usageMedian = usageSorted[Math.floor(usageSorted.length / 2)] || 0;
  const usagePeak = usageSorted[usageSorted.length - 1] || 0;
  const usageP98 = usageSorted[Math.min(usageSorted.length - 1,
    Math.floor(usageSorted.length * 0.98))] || 0;
  // Fold only when it buys something. A session whose peak is within 3x of its
  // own median has no outlier problem, and folding there would trade a readable
  // chart for a gratuitous "1 of 2".
  const usageFolds = usageMode
    && usageMedian > 0
    && usagePeak > usageMedian * FOLD_TRIGGER;
  const usageCeiling = usageFolds
    ? Math.max(usageMedian * FOLD_HEADROOM, usageP98)
    : Math.max(usagePeak, 1);

  const max = costMode
    ? costCeiling
    : usageMode
      ? usageCeiling
      : Math.max(...points.map((p) => p.total), 1);
  // Provisional: sizes the money grid below, and is the final answer in token
  // mode. Cost mode replaces the tick positions once the cell is known, but
  // keeps this `top` so the axis ceiling (and the y() clamp) are unchanged.
  const baseTicks = niceTicks(max * 1.06, 5, true);
  const top = baseTicks[baseTicks.length - 1];
  // --- Money grid sizing ------------------------------------------------
  //
  // Sized here, ahead of the gridlines, because in cost mode the gridlines are
  // derived from the cell rather than the other way round. See the tick block
  // below for why.
  //
  // Cost mode already means "band area is money": the y axis is dollars per
  // call and the x axis is calls, so a region's width x height carries units of
  // dollars. That makes a grid cell a *quantity of money*, and counting cells
  // under the stack estimates the spend directly.
  //
  // Cells are square in pixels, so the eye can count them without mentally
  // correcting for a stretched aspect. Solving side^2 = cell$ x px-per-call x
  // px-per-dollar gives the side for a given cell value.
  //
  // Powers of ten only, rather than a finer 1-2-5 ladder: a decade step keeps
  // the label a plain "$1" or "$10" instead of "$0.05" or "$50", and mental
  // arithmetic over the squares stays trivial.
  //
  // The ladder starts at $1 — no sub-dollar cells. A grid whose unit is $0.001
  // is technically well-sized but practically meaningless: "count the squares"
  // stops being a useful gesture when a square is a tenth of a cent.
  //
  // Usage mode uses the identical construction with tokens as the unit. The
  // ladder there runs over token decades instead of dollar decades, and the
  // preferred cell is one *percent of a 5-hour window* — the whole point of the
  // mode is that you can count squares to read quota consumption directly.
  // --- Slot allocation ------------------------------------------------------
  //
  // Ordinarily one point is one band. A folded turn occupies N consecutive
  // bands, so the plot is divided into total *slots* rather than points, and a
  // point's x position comes from the running slot offset instead of its index.
  //
  // Sized here, ahead of the quota grid, because the grid divides by the slot
  // count: a fold multiplies a bar's width and divides its height by the same N,
  // so area survives, but only if the grid measures the same slots the bars are
  // drawn in. Dividing by `points.length` while drawing in slots would inflate
  // every square and silently break the one guarantee this mode makes.
  //
  // Ceil, not round: a turn at 3.2x the ceiling needs 4 slices, and 3 would
  // leave it poking above the axis — the overflow this exists to prevent.
  const foldOf = (p) => {
    if (!usageFolds || p.compaction || p.usageTotal <= usageCeiling) return 1;
    return Math.min(FOLD_MAX, Math.ceil(p.usageTotal / usageCeiling));
  };
  const folds = points.map(foldOf);
  // Running start offset per point, in slots, plus the total the plot divides by.
  // `pointAtSlot` is the inverse — which point owns a given slot — used by the
  // area-mode hover, where the pointer lands on a slot rather than an index.
  const slotAt = [];
  const pointAtSlot = [];
  let slotCount = 0;
  for (let i = 0; i < points.length; i += 1) {
    slotAt.push(slotCount);
    for (let k = 0; k < folds[i]; k += 1) pointAtSlot.push(i);
    slotCount += folds[i];
  }
  const foldedCount = folds.filter((f) => f > 1).length;
  // A fold that hit FOLD_MAX still overflows the axis; counted so the legend can
  // say so rather than letting the bar quietly run off the top.
  const foldOverflow = points.filter(
    (p, i) => folds[i] > 1 && p.usageTotal / folds[i] > usageCeiling,
  ).length;

  let moneyGrid = null;
  if (costMode) {
    const MONEY_GRID_TARGET_PX = 42;
    const pxPerCall = plotW / points.length;
    const pxPerDollar = plotH / top;
    for (let e = 0; e <= 4; e += 1) {
      const value = 10 ** e;
      const side = Math.sqrt(value * pxPerCall * pxPerDollar);
      const score = Math.abs(Math.log(side / MONEY_GRID_TARGET_PX));
      if (!moneyGrid || score < moneyGrid.score) moneyGrid = { value, side, score };
    }
  } else if (usageMode) {
    // Slots, not points — see the slot allocation above. This is the divisor
    // that keeps a square worth 1% when bars are folded.
    const pxPerCall = plotW / slotCount;
    const pxPerToken = plotH / top;
    // One rung only: 1% of a window, never a subdivision. Same reasoning as the
    // money grid's $1 floor — a square worth a tenth of a percent is well-sized
    // geometrically but useless to count, and "0.1%" reads as noise next to a
    // meter that only ever reports whole percent. There is no ladder to search,
    // so no score: if a 1% cell doesn't fit the plot, `gridFits` drops the grid
    // rather than substituting a unit nobody wants.
    const value = QUOTA_OUTPUT_TOKENS_PER_PERCENT;
    moneyGrid = { value, side: Math.sqrt(value * pxPerCall * pxPerToken), score: 0, frac: 1 };
  }

  // Needs at least ~2 cells on each axis to read as a grid. Without the upper
  // bound the $1 floor would draw a single line across an otherwise empty plot
  // on short sessions, which looks like a rendering bug rather than a unit.
  const gridFits = moneyGrid
    && Number.isFinite(moneyGrid.side)
    && moneyGrid.side > 4
    && moneyGrid.side <= plotW / 2
    && moneyGrid.side <= plotH / 2;

  // Gridlines on cell boundaries.
  //
  // The cell is $1 of *area* (dollars x calls) but the y axis measures dollars
  // of *height*, and the cell's height in dollars — sqrt(value x px-per-call /
  // px-per-dollar) — has no reason to divide a round $0.10 tick step. On a
  // typical session it comes out near $0.173, so round ticks cut the grid at
  // arbitrary fractions of a cell and the two systems visibly disagree.
  //
  // Neither the cell size nor the chart height can fix that: the cell must stay
  // pixel-square to be countable, and the misalignment scales as sqrt(height),
  // so even large height changes barely move it. So the ticks give way instead
  // — placed every `g` cells, which makes them land on cell edges exactly, at
  // any width, height, or call count. The cost is the axis labels, which stop
  // being round numbers ($0.17, $0.35 rather than $0.10, $0.20). Worth it: the
  // dollar figures that get *read* are the headline total and the cumulative
  // axis, while the left axis is mostly a scale reference, and a scale that
  // agrees with the grid drawn over it is worth more than round labels.
  //
  // `g` targets ~80px spacing and 2-7 lines; the fallback keeps token mode and
  // any session with no drawable grid on the original round ticks.
  let ticks = baseTicks;
  let cellDollars = 0;
  if (gridFits) {
    const pxPerDollar = plotH / top;
    cellDollars = moneyGrid.side / pxPerDollar;
    let chosen = null;
    for (let g = 1; g <= 8; g += 1) {
      const px = g * moneyGrid.side;
      const count = Math.floor(plotH / px + 1e-9);
      if (count < 2 || count > 7) continue;
      const cost = Math.abs(Math.log(px / 80));
      if (!chosen || cost < chosen.cost) chosen = { g, count, cost };
    }
    if (chosen) {
      ticks = [];
      for (let j = 0; j <= chosen.count; j += 1) ticks.push(j * chosen.g * cellDollars);
    }
  }
  // One precision for the whole axis, taken from the step rather than from each
  // value: fmtAxisUSD switches decimals by magnitude, which on a derived axis
  // prints "$0.49 $0.98 $1.5 $2.0" — the decimals changing partway down a
  // single column. Same reasoning as the cumulative axis below.
  const tickStep = ticks.length > 1 ? ticks[1] - ticks[0] : 0;
  const tickDp = tickStep >= 1 ? 2 : tickStep >= 0.1 ? 2 : tickStep >= 0.01 ? 3 : 4;
  // Usage mode's internal unit is output-token equivalents, but nobody reads
  // the meter in tokens — it reports whole percent — so the axis is labelled in
  // percent of a 5-hour window. Two decimals because a single turn is a small
  // fraction of a window and "0%" repeated down the column says nothing.
  const fmtLeft = usageMode
    ? (v) => (v / QUOTA_OUTPUT_TOKENS_PER_PERCENT).toFixed(2) + '%'
    : (v) => (ticks === baseTicks ? fmtAxisUSD(v) : '$' + v.toFixed(tickDp));

  // Bars sit in evenly divided bands; the area path spans edge to edge so the
  // trend reaches both sides of the plot.
  //
  // The bar fills its whole band but for a fixed 2px separator, because in cost
  // and usage mode the bar's *area* is the quantity and the money/quota grid is
  // sized off the full band (`pxPerCall = plotW / points.length`). A bar drawn
  // at a fraction of its band — this was `band * 0.7`, clamped to 24px — makes
  // counting squares under the stack understate the true figure by exactly that
  // fraction, and the 24px clamp made the shortfall vary with call count, so
  // the same quota read differently on a short session than a long one.
  //
  // A fixed 2px gap keeps the error a constant subtraction rather than a
  // proportional one: it costs 2/band of the area, a few percent at typical
  // call counts and near nothing on short sessions, where the old clamp was
  // worst (a 5-call session filled 20% of its band). Kept at all, rather than
  // going edge to edge, because the sawtooth in token mode is only readable if
  // you can still see where one turn ends and the next begins.
  //
  // Note this trades away accuracy at the *other* end: 2px is a growing share
  // of a shrinking band, so as the band narrows the fill drops below the 70%
  // the old rule held. MIN_BAR_BAND_PX bounds that: bar mode ends once the gap
  // would cost more than 2/5 of the band.
  const band = plotW / slotCount;
  const useBars = band >= MIN_BAR_BAND_PX;
  const BAR_GAP = 2;
  // Drawn width of a turn occupying `n` slots — one gap total, at the outer
  // edges, however many slots it spans. An unfolded turn is just n = 1, so this
  // is the old `band - BAR_GAP` and folding is the general case rather than a
  // special one. The gap is not multiplied per slice: inside a fold there is no
  // turn boundary to show, and charging a gap per slice under-drew a folded
  // turn's area by up to 54% against the quantity it is supposed to encode.
  const runWidth = (n) => Math.max(1, band * n - BAR_GAP);
  // The centre of a point's *whole* run of slots, so the cumulative line and the
  // compaction markers still land on the middle of what they refer to.
  //
  // Both modes measure x in slots, so folding behaves identically in each. Area
  // mode used to interpolate over point indices, which made folds invisible
  // there: a spike stayed a spike and the ceiling it was folded under no longer
  // matched the shape drawn against it. In slot space a folded turn occupies its
  // full run at 1/N height, so it reads as a wide plateau — the same "spread it
  // sideways to keep the area" gesture the bars make, in continuous form.
  //
  // Area mode spans edge to edge, so it interpolates across slot *centres* and
  // stretches the ends to the plot edges; bar mode sits on band centres. The
  // -1 divisor mirrors the original index-space formula, now over slots.
  const slotSpan = Math.max(1, slotCount - 1);
  const xSlot = (s) => m.left + (slotCount === 1 ? plotW / 2 : (s / slotSpan) * plotW);
  const x = useBars
    ? (i) => m.left + band * (slotAt[i] + folds[i] / 2)
    : (i) => xSlot(slotAt[i] + (folds[i] - 1) / 2);
  // Clamped so a clipped cost band stops at the plot ceiling instead of
  // drawing outside the chart area.
  const y = (v) => m.top + plotH - (Math.min(v, top) / top) * plotH;

  // No `height` attribute: the CSS sizes the SVG to its host, and setting the
  // height here would make the host's own clientHeight — which H is measured
  // from — a function of the last render rather than of the space available.
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}` });

  // Cumulative cost rides on a second scale, drawn against the *same* gridlines
  // as the left axis. Giving it its own nice-tick set would put a second family
  // of horizontal lines at different heights and make the plot unreadable, so
  // instead the visible cumulative range is mapped onto the existing tick
  // fractions and each gridline gets a dollar label at the right.
  //
  // The scale spans the range covered by the visible calls, not [0, total]: the
  // running total only climbs, so anchoring at zero would squash the whole
  // visible segment into a sliver at the top whenever the window is late in a
  // long session.
  // Usage mode runs the same second scale over cumulative tokens instead of
  // cumulative dollars, so "how much of the window has this session eaten" is
  // readable off the right axis exactly as spend is in cost mode.
  const cumOf = (p) => (usageMode ? p.cumUsage : p.cum);
  const cumFirstStep = usageMode ? points[0].usageTotal : points[0].costTotal;
  const cumLo = cumOf(points[0]) - cumFirstStep;
  const cumHi = cumOf(points[points.length - 1]);
  // Flat window (a zero-cost stretch) would divide by zero; give it a nominal
  // span so the line sits on the baseline instead of vanishing.
  const cumSpan = cumHi - cumLo || 1;
  const cumY = (v) => m.top + plotH - ((v - cumLo) / cumSpan) * plotH;
  // One precision for the whole axis, chosen from the span rather than from
  // each value: fmtAxisUSD switches decimals by magnitude, which would print
  // "$0.59" above "$1.2" in the same column. The step between labels is what
  // has to stay distinguishable, so it sets the decimals.
  const cumStep = cumSpan / (ticks.length - 1 || 1);
  const cumDp = cumStep >= 1 ? 1 : cumStep >= 0.1 ? 2 : cumStep >= 0.01 ? 3 : 4;
  // Usage labels the cumulative axis in percent of a 5-hour window rather than
  // raw tokens: the running total is the one number where the quota reading is
  // the whole point, and "14.2%" answers it directly where "17.4M" needs the
  // unit applied by hand.
  const fmtCum = usageMode
    ? (v) => (v / QUOTA_OUTPUT_TOKENS_PER_PERCENT).toFixed(1) + '%'
    : (v) => '$' + v.toFixed(cumDp);

  for (const t of ticks) {
    const gy = y(t);
    svg.appendChild(svgEl('line', {
      class: 'grid-line', x1: m.left, x2: m.left + plotW, y1: gy, y2: gy,
    }));
    const label = svgEl('text', { class: 'tick', x: m.left - 8, y: gy + 4, 'text-anchor': 'end' });
    label.textContent = costMode ? fmtLeft(t) : compact(t);
    svg.appendChild(label);

    // Same gridline, right-hand side: the cumulative value at that height.
    const rightLabel = svgEl('text', {
      class: 'tick', x: m.left + plotW + 8, y: gy + 4, 'text-anchor': 'start',
      fill: 'var(--cumulative)',
    });
    rightLabel.textContent = fmtCum(cumLo + ((m.top + plotH - gy) / plotH) * cumSpan);
    svg.appendChild(rightLabel);
  }

  // Compaction markers: the transcript reports these explicitly, so they are
  // exact boundaries rather than a heuristic guess at a drop in the trend.
  //
  // Only markers that land inside the plotted call range are drawn. A session's
  // compaction list can include boundaries outside it (a resumed session whose
  // earlier calls aren't in this event list); clamping those to the first or
  // last call would pile up markers at the edges and imply drops that the
  // plotted data never shows. Anything out of range is reported in the legend
  // instead of being drawn in the wrong place.
  // Bounded by the visible slice, so zooming in also narrows which compactions
  // are drawn; the ones scrolled off are counted in the legend like any other
  // out-of-range boundary.
  const firstCallTs = points[0].e.timestamp;
  const lastCallTs = points[points.length - 1].e.timestamp;
  const allCompactions = (session.compactions || []).map((c) => c.timestamp).filter(Boolean);
  const inRange = allCompactions.filter(
    (ts) => (!firstCallTs || ts >= firstCallTs) && (!lastCallTs || ts <= lastCallTs),
  );

  const compactedAt = new Set();
  for (const ts of inRange) {
    const idx = points.findIndex((p) => p.e.timestamp && p.e.timestamp >= ts);
    if (idx < 0) continue;
    compactedAt.add(idx);
    // The boundary falls between the previous call and this one, so in bar
    // mode draw it at the leading edge of the band rather than through the
    // middle of a column it didn't split.
    // In usage mode the compaction is already drawn as its own bar in this
    // colour, so the marker line would be a second mark for one event.
    if (usageMode) continue;
    // Leading edge of the point's first slot, not of its index: with folding a
    // point's slot offset and its index diverge, and using the index would drift
    // the marker further left with every fold earlier in the window.
    const mx = useBars ? m.left + band * slotAt[idx] : x(idx);
    svg.appendChild(svgEl('line', {
      x1: mx, x2: mx, y1: m.top, y2: m.top + plotH,
      stroke: 'var(--critical)', 'stroke-width': 1,
    }));
  }
  const outOfRange = allCompactions.length - inRange.length;

  // Prompt-cache expiry markers.
  //
  // Derived, not reported: the transcript records no expiry event, so this is
  // inferred from the wall-clock gap between consecutive calls. If the gap
  // exceeded the TTL, the cache written by the earlier call was cold by the
  // time the later one ran, and that later call had to re-cache the context at
  // the write rate (1.25x/2x input) instead of reading it back at 0.1x.
  //
  // Both thresholds are always drawn regardless of which TTL the session
  // actually used, because the useful question is counterfactual: on a 5m
  // session the 1h marks show which lapses you would have avoided, and on a 1h
  // session the 5m marks show what switching would have cost. A 1h lapse is
  // necessarily also a 5m lapse, so the two are drawn as one marker promoted to
  // the longer TTL rather than two lines on the same pixel.
  //
  // Placed at the leading edge of the call that paid for it, matching the
  // compaction markers: the gap sits between two calls, so drawing it through
  // the middle of a column would attribute it to a call it didn't split.
  //
  // Suppressed where a compaction lands on the same call. Compaction rewrites
  // the context, so the next call pays the write rate whether or not the cache
  // was still warm -- the expiry cost nothing extra there, and a second line on
  // the same pixel would double-count one event and clutter the marker.
  const CACHE_TTL_5M_S = 300;
  const CACHE_TTL_1H_S = 3600;
  const expiries = [];
  for (let i = 1; i < points.length; i += 1) {
    if (compactedAt.has(i)) continue;
    const prev = points[i - 1].e.timestamp;
    const curr = points[i].e.timestamp;
    if (!prev || !curr) continue;
    const gapS = (Date.parse(curr) - Date.parse(prev)) / 1000;
    if (!Number.isFinite(gapS) || gapS <= CACHE_TTL_5M_S) continue;
    expiries.push({ i, gapS, ttl: gapS > CACHE_TTL_1H_S ? '1h' : '5m' });
  }
  for (const ex of expiries) {
    const mx = useBars ? m.left + band * slotAt[ex.i] : x(ex.i);
    svg.appendChild(svgEl('line', {
      x1: mx, x2: mx, y1: m.top, y2: m.top + plotH,
      stroke: 'var(--cache-expiry)', 'stroke-width': 1,
      // Same hue for both, so the dash is what separates them: a 1h lapse is
      // the rarer, more expensive event and gets the longer, more assertive
      // dash. Both dashed, so neither is mistaken for a solid compaction line.
      'stroke-dasharray': ex.ttl === '1h' ? '8 3' : '2 4',
      'stroke-opacity': ex.ttl === '1h' ? 0.95 : 0.7,
    }));
  }
  const expired5m = expiries.filter((e) => e.ttl === '5m').length;
  const expired1h = expiries.filter((e) => e.ttl === '1h').length;

  // Stacked bands, drawn bottom band first. Each band is the region between
  // the running total below it and the running total including it, so the
  // stack height is whatever the mode measures: the context window in token
  // mode, the call's spend in cost mode, its quota draw in usage mode.
  const lower = new Array(points.length).fill(0);
  // Each mode stacks its own quantity: dollars, quota-equivalents, or raw
  // tokens. Usage mode's zero-weight bands contribute nothing and are skipped
  // by the `upper <= lower` guards below, so no invisible rect is emitted.
  //
  // Usage mode divides every band by the point's fold, not just the total: each
  // slice is a faithful 1/N of the whole turn, so the composition inside a slice
  // matches the composition of the turn and the slices are interchangeable. The
  // stack height of one slice is then usageTotal/N, which is what puts a folded
  // turn back under the ceiling.
  const bandOf = costMode
    ? (p, si) => p.costs[si]
    : usageMode
      ? (p, si, i) => p.quotas[si] / folds[i]
      : (p, si) => p.parts[si];
  STACK.forEach((s, si) => {
    // A band that is zero everywhere draws nothing. The bar path already skips
    // it per-point; the area path would otherwise emit a zero-height sliver
    // hugging the band below and darken it through the 0.85 fill.
    if (usageMode && !s.quota) return;
    const upper = points.map((p, i) => lower[i] + bandOf(p, si, i));

    if (useBars) {
      // One rect per call. No inter-segment gap here (unlike the daily chart):
      // with cache read at ~99% of a token-mode stack, the thin bands are only
      // a pixel or two tall and a gap would erase them entirely.
      points.forEach((p, i) => {
        // Compaction bars are drawn separately below: they have no token-type
        // breakdown, and their width carries meaning here.
        if (p.compaction) return;
        if (upper[i] <= lower[i]) return;
        const yTop = y(upper[i]);
        const h = y(lower[i]) - yTop;
        if (h <= 0) return;
        // A folded turn is ONE rect spanning all its slots, not one per slice.
        //
        // BAR_GAP exists to show where one turn ends and the next begins. Inside
        // a fold there is no such boundary — the slices are a single turn — so a
        // gap there draws a division that isn't in the data, and it read as
        // several short turns rather than one tall one. The gap is kept at the
        // outer edges, which are real turn boundaries.
        //
        // What separates the slices instead is the tie bar and the "1 of N"
        // labels above: those say "one turn, N slices" without claiming the ink
        // underneath is discontinuous. Countability was the reason for the
        // per-slice gap, and the labels do that job without the false boundary.
        //
        // Centred on the run rather than inset from its left edge, so that when
        // the width hits its 1px floor on a sub-pixel band the overhang is split
        // evenly instead of pushing the last bar past the right edge of the plot.
        const runW = runWidth(folds[i]);
        svg.appendChild(svgEl('rect', {
          x: m.left + band * (slotAt[i] + folds[i] / 2) - runW / 2, y: yTop,
          width: runW, height: h,
          fill: s.color, 'fill-opacity': 0.85,
        }));
      });
    } else {
      // Forward along the top edge, back along the bottom edge.
      //
      // A folded point contributes a vertex at each end of its run rather than
      // one at its centre, so its reduced height is held flat across every slot
      // it occupies. With a single centre vertex the path would ramp straight
      // through the plateau and the triangles lost on either side would eat
      // exactly the area the fold was meant to preserve.
      //
      // Unfolded points have both ends at the same slot, so they collapse back
      // to one vertex and the path is identical to before folding existed.
      const verts = (row) => {
        const out = [];
        for (let i = 0; i < points.length; i += 1) {
          const a = xSlot(slotAt[i]);
          const b = xSlot(slotAt[i] + folds[i] - 1);
          const vy = y(row[i]);
          out.push([a, vy]);
          if (b !== a) out.push([b, vy]);
        }
        return out;
      };
      const topV = verts(upper);
      const botV = verts(lower).reverse();
      const top = topV.map(([px, py], k) => `${k ? 'L' : 'M'}${px},${py}`).join(' ');
      const bottom = botV.map(([px, py]) => `L${px},${py}`).join(' ');

      svg.appendChild(svgEl('path', {
        d: `${top} ${bottom} Z`, fill: s.color, 'fill-opacity': 0.85, stroke: 'none',
      }));
    }

    for (let i = 0; i < points.length; i += 1) lower[i] = upper[i];
  });

  // --- Fold labels ----------------------------------------------------------
  //
  // A fold is only honest if it is declared: without a label, five slices read
  // as five ordinary turns and the chart lies about the call count. "1 of 5" on
  // each slice says both that this is one turn and how much of it you are
  // looking at, so the total is recoverable by eye (slice height x N).
  //
  // Labels sit just above the slice's own top edge, and are dropped when the
  // slot is too narrow to hold the text — a clipped "1 o…" is worse than the
  // bracket alone, which still groups the slices visually.
  //
  // Both modes label the same way, off the same slot geometry; only the edges
  // differ. A bar-mode fold is one rect inset by the gap that separates it from
  // the turns either side; the area path has no gaps, so its run is measured
  // centre to centre and the tie bar sits flush with the plateau it spans.
