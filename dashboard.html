  if (usageMode && foldedCount) {
    // Per-slot width available to a label, which is what decides whether the
    // text fits — the band in bar mode, the slot pitch in area mode.
    const slotPitch = useBars ? band : plotW / slotSpan;
    points.forEach((p, i) => {
      const n = folds[i];
      if (n < 2) return;
      const yTop = y(p.usageTotal / n);
      // Flush with the outer edges of the run, matching the single rect the
      // fold now draws.
      const runW = runWidth(n);
      const runL = useBars
        ? m.left + band * (slotAt[i] + n / 2) - runW / 2
        : xSlot(slotAt[i]);
      const runR = useBars
        ? m.left + band * (slotAt[i] + n / 2) + runW / 2
        : xSlot(slotAt[i] + n - 1);
      // ~7px per character at this size; below that the label overlaps its
      // neighbour and the slot number is unreadable anyway.
      const fits = slotPitch >= `${n} of ${n}`.length * 7;
      // A tie bar across the whole run, so the slices read as one turn even
      // where the per-slice labels have been dropped for width.
      svg.appendChild(svgEl('line', {
        x1: runL, x2: runR, y1: yTop - 4, y2: yTop - 4,
        stroke: 'var(--text-secondary)', 'stroke-width': 1, 'stroke-opacity': 0.5,
      }));
      // Ticks on the tie bar where the slices divide. The bar itself is now one
      // continuous rect, so these are the only marks left showing how many
      // slices it is — and they sit above the data rather than cutting into it,
      // which is the difference between annotating the fold and faking a gap in
      // the turn. Drawn in bar mode only: the area path has no discrete slices
      // to divide, just a plateau.
      if (useBars) {
        for (let k = 1; k < n; k += 1) {
          const tx = m.left + band * (slotAt[i] + k);
          svg.appendChild(svgEl('line', {
            x1: tx, x2: tx, y1: yTop - 6, y2: yTop - 2,
            stroke: 'var(--text-secondary)', 'stroke-width': 1, 'stroke-opacity': 0.5,
          }));
        }
      }
      if (!fits) return;
      for (let k = 0; k < n; k += 1) {
        const label = svgEl('text', {
          class: 'tick',
          x: useBars
            ? m.left + band * (slotAt[i] + k + 0.5)
            : xSlot(slotAt[i] + k),
          y: yTop - 8,
          'text-anchor': 'middle',
          'pointer-events': 'none',
        });
        label.textContent = `${k + 1} of ${n}`;
        svg.appendChild(label);
      }
    });
  }

  // --- Compaction markers (usage mode) ---------------------------------------
  //
  // Drawn after the stack so they sit above it. These were bars until the
  // cache-write term landed: a compaction's real cost is the re-cache on the
  // *next* call, so charging the boundary too would double-count it.
  if (usageMode) {
    // Compactions carry no quota of their own, so they are drawn as full-height
    // markers rather than bars. A bar would imply an area, and the area is zero
    // — the spike immediately to the right is where the cost actually lands.
    points.forEach((p, i) => {
      if (!p.compaction) return;
      svg.appendChild(svgEl('line', {
        x1: x(i), x2: x(i), y1: m.top, y2: m.top + plotH,
        stroke: 'var(--critical)',
        'stroke-width': 1,
        'stroke-dasharray': '3 3',
        'stroke-opacity': 0.7,
      }));
    });
  }

  // A thin line on the stack's top edge keeps the outline legible where the
  // topmost bands are only a few pixels tall. In token mode that outline is
  // the context window; in cost mode it is the per-call total spend. Columns
  // carry their own edges, so this is area mode only.
  if (!useBars) {
    // Traces the same plateaus as the fill below it — two vertices across a
    // folded run, one otherwise. Deriving it from `x(i)` instead would cut the
    // corners the fill draws square and leave the outline floating off the top
    // edge of its own area.
    const outline = points
      .flatMap((p, i) => {
        const a = xSlot(slotAt[i]);
        const b = xSlot(slotAt[i] + folds[i] - 1);
        const vy = y(lower[i]);
        return b !== a ? [[a, vy], [b, vy]] : [[a, vy]];
      })
      .map(([px, py], k) => `${k ? 'L' : 'M'}${px},${py}`)
      .join(' ');
    svg.appendChild(svgEl('path', {
      d: outline, fill: 'none', stroke: 'var(--text-primary)',
      'stroke-width': 1, 'stroke-opacity': 0.35, 'stroke-linejoin': 'round',
    }));
  }

  // --- Money grid -----------------------------------------------------------
  //
  // Sized and aligned further up, before the gridlines that are derived from
  // it. This block only draws it.
  if (gridFits) {
    const side = moneyGrid.side;
    const defs = svgEl('defs');
    // Unique per render: several charts can share the document, and a repeated
    // id would make them all resolve to whichever defs block came first.
    const uid = `mg${Math.random().toString(36).slice(2, 9)}`;

    // Lines are anchored to the axes (bottom-left), not the top-left, so a cell
    // boundary always sits on $0 and on the first call. Otherwise the grid
    // would float against the very axes it is supposed to be measuring.
    //
    // This anchoring is also what makes the derived gridlines land exactly on
    // cell edges: both count upward from $0 in whole cells, so tick j sits on
    // the (j x g)th cell boundary with no accumulated drift.
    const pattern = svgEl('pattern', {
      id: `${uid}-p`, width: side, height: side,
      patternUnits: 'userSpaceOnUse',
      // Offset so the pattern's own origin lands on the plot's bottom-left.
      x: m.left, y: m.top + plotH - Math.ceil(plotH / side) * side,
    });
    pattern.appendChild(svgEl('path', {
      d: `M0,0 H${side} M0,0 V${side}`,
      // 1.5px: a 1px line lands on a fractional device pixel at most container
      // widths and gets antialiased into a smear, which cost the grid more
      // visibility than any color choice did.
      fill: 'none', stroke: 'var(--money-grid)', 'stroke-width': 1.5,
    }));
    defs.appendChild(pattern);

    // The grid draws uniformly across the whole plot — no reveal, no fade.
    //
    // This previously ran through a luminance mask: first a cursor-following
    // halo, then an edge-only frame that faded to nothing toward the centre.
    // Both are gone. The halo made the cost view laggy (every mousemove
    // re-resolved the mask and recomposited the grid across the plot), and the
    // edge fade meant the grid was absent from exactly the middle region where
    // you actually count squares under the stack.
    //
    // Dropping the mask also removes a trap: a luminance mask multiplies the
    // stroke's own brightness, so saturating the purple made the grid dimmer
    // and the only way to brighten it was to wash the color out. Now the stroke
    // color is the only thing controlling how the grid reads.
    svg.appendChild(defs);

    // The rect's own bounds clip the pattern to the plot, so no clip-path is
    // needed now that the mask is gone.
    svg.appendChild(svgEl('rect', {
      x: m.left, y: m.top, width: plotW, height: plotH,
      fill: `url(#${uid}-p)`,
      // Slightly under 1 so the grid sits behind the data rather than competing
      // with it — the only restraint left now that the fade is gone, which is
      // why it is a light touch rather than the old 0.45.
      'fill-opacity': 0.85, 'pointer-events': 'none',
    }));

    // A single filled cell, drawn at exactly `side` so it is the unit rather
    // than a picture of it — the eye can carry this square out into the plot and
    // match it against the grid without any scaling.
    //
    // Anchored to the pattern's own phase, not to the plot corner: the grid is
    // aligned to the bottom-left, so an arbitrary top-left offset would put the
    // key a fraction of a cell out of step with every line around it and read as
    // a rendering fault. Stepping down whole cells from the pattern origin keeps
    // it flush, and one cell in from the left leaves the y-axis labels clear.
    const gridOriginY = m.top + plotH - Math.ceil(plotH / side) * side;
    let keyY = gridOriginY;
    while (keyY < m.top + 2) keyY += side;
    const keyX = m.left + side;
    // Only when the key clears the plot: on a chart two cells tall it would sit
    // on top of the data it is meant to explain.
    if (keyY + side <= m.top + plotH && keyX + side <= m.left + plotW) {
      svg.appendChild(svgEl('rect', {
        x: keyX, y: keyY, width: side, height: side,
        fill: 'var(--money-grid)', 'fill-opacity': 0.28,
        stroke: 'var(--money-grid)', 'stroke-width': 1.5,
        'pointer-events': 'none',
      }));
      // Value inside the square when it is big enough to hold the text, beside
      // it when it isn't — at the small end of the ladder a centred label would
      // overflow its own cell.
      const label = usageMode
        ? '1%'
        : `$${moneyGrid.value.toFixed(Math.max(0, -Math.round(Math.log10(moneyGrid.value))))}`;
      const fits = side >= 34;
      const text = svgEl('text', {
        class: 'tick',
        x: fits ? keyX + side / 2 : keyX + side + 6,
        y: fits ? keyY + side / 2 + 4 : keyY + side / 2 + 4,
        'text-anchor': fits ? 'middle' : 'start',
        fill: 'var(--money-grid)', 'pointer-events': 'none',
      });
      text.setAttribute('font-weight', '600');
      text.textContent = label;
      svg.appendChild(text);
    }
  }

  // Cumulative cost, overlaid on its own scale. Drawn after the bands so it
  // stays legible over them, and before the hit targets so hovering still
  // reaches the tooltip rects rather than landing on the line.
  //
  // In bar mode the points sit at band centres like the columns; in area mode
  // they span edge to edge, matching x() either way.
  const cumPath = points
    .map((p, i) => `${i ? 'L' : 'M'}${x(i)},${cumY(cumOf(p))}`)
    .join(' ');
  svg.appendChild(svgEl('path', {
    d: cumPath, fill: 'none', stroke: 'var(--cumulative)',
    'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round',
  }));

  // Baseline for the elapsed figure: the first call of the session, not of the
  // zoom window, so a call's offset doesn't change when you zoom into it.
  const t0 = Date.parse(allPoints[0].e.timestamp);

  const whenRow = (p) => {
    const t = Date.parse(p.e.timestamp);
    const gap = Number.isFinite(t0) && Number.isFinite(t) ? fmtElapsed(t - t0) : '';
    return ['Time', fmtClock(p.e.timestamp) + (gap ? ` · +${gap}` : '')];
  };

  // Bare percent for the band rows, where the unit is established by the rows
  // around it; the long form for the summary rows that have to stand alone.
  const barePct = (v) => (v / QUOTA_OUTPUT_TOKENS_PER_PERCENT).toFixed(2) + '%';
  const pctOf = (v) => barePct(v) + ' of a 5-hour window';

  const tipRows = (p, idx) => {
    // A compaction has no token-type stack to describe, so it gets its own rows
    // rather than four "0 tok" bands.
    if (p.compaction) {
      return [
        whenRow(p),
        ['Event', 'Compaction' + (p.e.trigger ? ` (${p.e.trigger})` : '')],
        ['Context summarized', fmtInt(p.e.preTokens || 0) + ' tok (cache read — not metered)'],
        ['Summary produced', fmtInt(p.e.postTokens || 0) + ' tok'],
        ['Quota', 'counted on the next call, as its cache write'],
        ['Used so far', pctOf(p.cumUsage)],
      ];
    }
    return [
      whenRow(p),
      // Bands top-down, so the tooltip order matches what the eye sees. Usage
      // mode lists only the bands it draws, in the axis's own unit: the two
      // unmetered types are not part of this reading, and printing their token
      // counts here invites exactly the misreading the mode exists to avoid.
      ...STACK
        .filter((s) => !usageMode || s.quota)
        .map((s) => {
          const si = STACK.indexOf(s);
          return [
            s.label,
            costMode
              ? `${fmtExactUSD(p.costs[si])} · ${compact(p.parts[si])} tok`
              : usageMode
                ? barePct(p.quotas[si])
                : fmtInt(p.parts[si]) + ' tok',
          ];
        })
        .reverse(),
      ...(costMode
        ? [['Call cost',
            fmtExactUSD(p.costTotal) + (p.costTotal > costCeiling ? ' (clipped)' : '')],
           ['Spent so far', fmtExactUSD(p.cum)]]
        : usageMode
          ? [['Quota', pctOf(p.usageTotal)
              // The bar is drawn short by design here, so the tooltip says so
              // and gives the height one slice actually represents — otherwise
              // the figure above and the ink on screen appear to disagree.
              + (folds[idx] > 1
                ? ` — drawn as ${folds[idx]} slices of ${barePct(p.usageTotal / folds[idx])}`
                : '')],
             ['Used so far', pctOf(p.cumUsage)]]
          : [['Context window', fmtInt(p.ctx) + ' tok'],
             ['Spent so far', fmtExactUSD(p.cum)]]),
      ['Model', p.e.modelLabel || '—'],
    ];
  };

  if (useBars) {
    // A hit target per band, so hovering a column never demands pixel
    // precision against the gap next to it.
    points.forEach((p, idx) => {
      // Spans the point's whole run of slots, so a folded turn is one hover
      // target: its slices are one call and must report one tooltip.
      const hit = svgEl('rect', {
        x: m.left + band * slotAt[idx], y: m.top,
        width: band * folds[idx], height: plotH, fill: 'transparent',
      });
      hit.addEventListener('mousemove', (e) =>
        showTip(e, `Call ${p.i + 1} of ${allPoints.length}`, tipRows(p, idx)));
      hit.addEventListener('mouseleave', hideTip);
      svg.appendChild(hit);
    });
  } else {
    const hit = svgEl('rect', {
      x: m.left, y: m.top, width: plotW, height: plotH, fill: 'transparent',
    });
    hit.addEventListener('mousemove', (e) => {
      const rect = svg.getBoundingClientRect();
      const rel = ((e.clientX - rect.left) / rect.width) * W;
      const ratio = (rel - m.left) / plotW;
      // Resolved through slot space, matching the path: anywhere over a folded
      // turn's plateau reports that turn, so the whole width of a fold is one
      // hover target exactly as its single bar-mode target is.
      const slot = Math.max(0, Math.min(slotCount - 1, Math.round(ratio * slotSpan)));
      const idx = pointAtSlot[slot];
      const p = points[idx];
      showTip(e, `Call ${p.i + 1} of ${allPoints.length}`, tipRows(p, idx));
    });
    hit.addEventListener('mouseleave', hideTip);
    svg.appendChild(hit);
  }

  svg.appendChild(svgEl('line', {
    class: 'axis-line', x1: m.left, x2: m.left + plotW, y1: m.top + plotH, y2: m.top + plotH,
  }));
  const xlab = svgEl('text', {
    class: 'tick', x: m.left + plotW / 2, y: m.top + plotH + 20, 'text-anchor': 'middle',
  });
  // Only labelled while zoomed, where it says which slice you are looking at.
  // Unzoomed, the axis is self-evidently the calls in order and needs no caption.
  const zoomed = Boolean(detailZoom);
  xlab.textContent = zoomed
    ? `calls ${view.start + 1}–${view.end} of ${allPoints.length}`
    : '';
  svg.appendChild(xlab);

  // --- Zoom interactions ----------------------------------------------------
  //
  // Pointer position is converted to a fractional call index, so wheel-zoom
  // keeps whatever is under the cursor pinned in place rather than always
  // zooming to the middle.
  // Converted through slots rather than straight from the width fraction: once
  // folding is in play a slot is not a call, so a plain fraction would name a
  // call the cursor is not over and zoom would slide sideways as it went in.
  // Reads as the original formula when nothing is folded, where slots and calls
  // are one to one.
  const callAt = (clientX) => {
    const rect = svg.getBoundingClientRect();
    const rel = ((clientX - rect.left) / rect.width) * W;
    const ratio = Math.max(0, Math.min(1, (rel - m.left) / plotW));
    const slot = Math.max(0, Math.min(slotCount - 1, Math.round(ratio * slotSpan)));
    // Fractional within the hovered point, so panning stays smooth rather than
    // snapping call by call.
    const idx = pointAtSlot[slot];
    const within = folds[idx] > 1 ? (slot - slotAt[idx]) / folds[idx] : 0;
    return view.start + idx + within;
  };

  const applyZoom = (next) => {
    const clamped = clampZoom(next, allPoints.length);
    const same = (!clamped && !detailZoom)
      || (clamped && detailZoom
          && clamped.start === detailZoom.start && clamped.end === detailZoom.end);
    if (same) return;
    detailZoom = clamped;
    renderSessionDetail(session, events);
  };

  // passive:false so the page doesn't scroll while the cursor is over the plot.
  svg.addEventListener('wheel', (e) => {
    if (!e.deltaY) return;
    e.preventDefault();
    const anchor = callAt(e.clientX);
    const span = view.end - view.start;
    // Trackpads emit many small deltas and mice a few large ones; scaling by a
    // capped magnitude keeps both feeling like the same gesture.
    const step = Math.min(Math.abs(e.deltaY), 100) / 100;
    const factor = e.deltaY > 0 ? 1 + 0.6 * step : 1 - 0.4 * step;
    const nextSpan = span * factor;
    if (nextSpan >= allPoints.length) return applyZoom(null);
    // Keep `anchor` at the same fraction across the plot.
    const frac = span > 0 ? (anchor - view.start) / span : 0.5;
    applyZoom({ start: anchor - frac * nextSpan, end: anchor + (1 - frac) * nextSpan });
  }, { passive: false });

  // Drag to pan, but only while zoomed — otherwise there is nothing to pan to
  // and the grab cursor would be a lie.
  if (zoomed) {
    svg.style.cursor = 'grab';
    svg.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      hideTip();
      // The listeners go on `window`, not the SVG: applyZoom re-renders and
      // replaces this element, so anything bound to it would be detached after
      // the first move and the drag would stall. Geometry is captured up front
      // for the same reason — `rect` below belongs to the element that started
      // the gesture, which stays valid because the replacement occupies the
      // same box.
      const rect = svg.getBoundingClientRect();
      const base = { ...view };
      const startCall = callAt(e.clientX);
      host.style.cursor = 'grabbing';

      const onMove = (ev) => {
        // Measured against the window the drag *started* in, so the chart
        // tracks the pointer 1:1 instead of accelerating as it shifts.
        const rel = ((ev.clientX - rect.left) / rect.width) * W;
        const ratio = Math.max(0, Math.min(1, (rel - m.left) / plotW));
        const nowCall = base.start + ratio * (base.end - base.start);
        const shift = startCall - nowCall;
        if (Math.abs(shift) < 0.5) return;
        applyZoom({ start: base.start + shift, end: base.end + shift });
      };
      const onUp = () => {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onUp);
        host.style.cursor = '';
      };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    });
  }

  setChildren(host, svg);

  // The swatch on the plot carries the unit and its value, so this line is left
  // with only the caveat a square cannot show. Bar mode draws columns at 70% of
  // their band, so the *ink* is 70% of the area it represents and a naive count
  // runs ~30% low; area mode is gapless and needs no such warning, which is why
  // the non-usage note disappears entirely there.
  //
  // `gridFits`, not `moneyGrid`: a value is always chosen, but it is only drawn
  // when it fits the plot. Keying the note off the value alone would describe a
  // square that is nowhere on screen.
  const gridNote = el('detail-grid-note');
  gridNote.hidden = !gridFits;
  if (gridFits) {
    if (usageMode) {
      gridNote.textContent =
        `Each square is 1% of a 5-hour window (~${compact(moneyGrid.value)} output tokens, ` +
        `or ~${compact(QUOTA_CACHE_WRITE_TOKENS_PER_PERCENT)} cache-write tokens)` +
        (useBars ? ' — measured per column band, not the drawn bar width. ' : '. ') +
        // Squares are the unit folding is meant to preserve, so the note says how
        // to count one: across the whole run, not per slice. Without this the
        // grid and the "1 of N" label describe the same turn two different ways
        // and the reader has to guess which to trust.
        (foldedCount
          ? 'A folded turn is counted across all its slices. '
          : '') +
        quotaCalibrationNote(points);
    } else {
      gridNote.textContent = useBars
        ? 'Measured per column band, not the drawn bar width.'
        : '';
      gridNote.hidden = !useBars;
    }
  }

  // The series this mode actually draws. Usage mode omits the unmetered types
  // — a swatch or a column for a band that isn't there describes a different
  // chart. Shared by the legend and the table below.
  const cols = STACK.filter((s) => !usageMode || s.quota);

  el('detail-legend').innerHTML =
    cols.slice().reverse().map(
      (s) => `<span class="item"><span class="swatch" style="background:${s.color}"></span>${s.label}</span>`,
    ).join('') +
    `<span class="item"><span class="swatch" style="background:var(--cumulative)"></span>` +
    (usageMode
      ? `Used so far — right axis (${(cumHi / QUOTA_OUTPUT_TOKENS_PER_PERCENT).toFixed(1)}% of a 5-hour window)`
      : `Spent so far — right axis (${fmtExactUSD(cumHi)})`) +
    '</span>' +
    (inRange.length
      ? `<span class="item"><span class="swatch" style="background:var(--critical)"></span>Compaction (${inRange.length})</span>`
      : '') +
    (outOfRange
      ? `<span class="item muted">${outOfRange} compaction${outOfRange > 1 ? 's' : ''} outside the plotted calls</span>`
      : '') +
    // Only shown when there is something to point at. A session with no lapses
    // is the common case, and a permanent "0 expiries" entry would add noise to
    // every chart to report a non-event.
    (expired5m
      ? `<span class="item" style="color:var(--cache-expiry)">` +
        `<span class="swatch line line-5m"></span>` +
        `<span style="color:var(--text-secondary)">5m cache lapse (${expired5m})</span></span>`
      : '') +
    (expired1h
      ? `<span class="item" style="color:var(--cache-expiry)">` +
        `<span class="swatch line line-1h"></span>` +
        `<span style="color:var(--text-secondary)">1h cache lapse (${expired1h})</span></span>`
      : '') +
    (clipped
      ? `<span class="item muted">${clipped} call${clipped > 1 ? 's' : ''} above ${fmtAxisUSD(costCeiling)} clipped to the top — hover for the real figure</span>`
      : '') +
    // Folding is disclosed in the legend as well as on the bars: the per-slice
    // labels vanish on a narrow plot, and the reader still needs to know that
    // some columns are one turn rather than several.
    (foldedCount
      ? `<span class="item muted">${foldedCount} turn${foldedCount > 1 ? 's' : ''} ` +
        `folded into slices to fit the scale — full area preserved, hover for the total</span>`
      : '') +
    (foldOverflow
      ? `<span class="item muted">${foldOverflow} still above the axis at the ` +
        `${FOLD_MAX}-slice limit</span>`
      : '');

  // The table mirrors whichever mode is showing, so the chart's units and the
  // table's units always agree. It also follows the zoom — the last 40 calls
  // *of the visible window* — so the label has to say which it is.
  const shown = Math.min(40, points.length);
  el('detail-table-label').textContent = detailZoom
    ? `Table view — model calls (last ${shown} of ${fmtInt(points.length)} in view)`
    : `Table view — model calls (last ${shown})`;
  setTableHTML(el('detail-table'),
    '<thead><tr><th class="num">#</th><th>Time</th><th>Model</th>' +
    cols.map((s) => `<th class="num">${s.label}</th>`).join('') +
    (costMode
      ? '<th class="num">Call cost</th>'
      : usageMode
        ? '<th class="num">% window</th><th class="num">Used so far</th>'
        : '<th class="num">Context</th><th class="num">Cost</th>') +
    '</tr></thead><tbody>' +
    points.slice(-40).map((p) =>
      `<tr><td class="num">${p.i + 1}</td><td>${fmtClock(p.e.timestamp)}</td>` +
      // A compaction has no model of its own; naming the event is more useful
      // than an em dash, and it is the only row type where the token columns
      // are legitimately blank.
      `<td>${p.compaction ? 'Compaction' : (p.e.modelLabel || '—')}</td>` +
      cols.map((s) => {
        const si = STACK.indexOf(s);
        return `<td class="num">${
          p.compaction ? '—'
            : costMode ? fmtExactUSD(p.costs[si])
              : usageMode ? barePct(p.quotas[si])
                : fmtInt(p.parts[si])
        }</td>`;
      }).join('') +
      (costMode
        ? `<td class="num">${fmtExactUSD(p.costTotal)}</td>`
        : usageMode
          ? `<td class="num">${barePct(p.usageTotal)}</td>` +
            `<td class="num">${barePct(p.cumUsage)}</td>`
          : `<td class="num">${fmtInt(p.ctx)}</td>` +
            `<td class="num">${fmtExactUSD((p.e.cost && p.e.cost.total) || 0)}</td>`) +
      '</tr>',
    ).join('') +
    '</tbody>');
}

// --- Data plumbing ----------------------------------------------------------
let stats = null;
let sessions = [];
let selectedId = null;
// 'usage' (quota per turn) | 'cost' (money per turn) | 'absolute' (tokens per
// turn). Not 'absolute': cache read is a median ~99% of every turn, so on the
// raw token axis the other three bands are sub-pixel and the chart opens on a
// view where nothing but cache read is legible. Both weighted modes fix that by
// scaling the bands by what they actually consume.
//
// Usage over cost because the quota window is the binding constraint in
// practice — it is what stops a session, whereas the dollar figure is a number
// you note afterwards. It also drops cache reads entirely (they are unmetered),
// so the opening view is the one where the dominant band is not just scaled
// down but correctly absent.
let detailMode = 'usage';
// Horizontal zoom over the session chart, as a half-open index range into the
// call list — not a pixel transform. Keeping it in call space means the
// bar/area threshold, the tooltips and the compaction markers all keep working
// on the visible slice without knowing zoom exists. null is "show everything",
// which is also what a session switch resets to.
let detailZoom = null; // { start, end } | null
let detailData = null;       // last-rendered session payload, for re-render on toggle

function renderSessions() {
  const rows = sessions.slice(0, 60);
  setTableHTML(el('sessions-table'),
    '<thead><tr><th>Session</th><th>Project</th><th class="num">Calls</th>' +
    '<th class="num">Context</th><th class="num">Cost</th>' +
    '<th class="num" title="Output plus cache write, in percent of a 5-hour ' +
    'window. A long session straddles window resets, so this can exceed 100%.">' +
    '% 5hr.<br>window</th>' +
    '<th>Cache TTL</th><th>Last active</th></tr></thead><tbody>' +
    rows.map((s) => {
      const name = s.title || s.sessionId.slice(0, 8);
      const when = s.lastTimestamp ? new Date(s.lastTimestamp).toLocaleString() : '—';
      const project = (s.project || '').split('/').filter(Boolean).pop() || '—';
      const badge = s.isSidechain
        ? `<span class="pill">${s.agentType || 'subagent'}</span> `
        : '';
      const ttl = cacheTtl(s.totals);
      const ttlCell = ttl.kind === 'none'
        ? '<span class="muted">—</span>'
        : `<span class="pill ttl-${ttl.kind}">${ttl.label}</span>`;
      // Same unit and weights as the usage chart's headline, computed from the
      // session totals rather than per call — the sum is identical either way.
      const usagePct = quotaEquivOf(s.totals.outputTokens, s.totals.cacheCreationTokens)
        / QUOTA_OUTPUT_TOKENS_PER_PERCENT;
      return `<tr data-id="${encodeURIComponent(s.sessionId)}" ${s.sessionId === selectedId ? 'class="selected"' : ''}>
        <td class="name">${badge}${name}</td>
        <td class="name muted">${project}</td>
        <td class="num">${fmtInt(s.totals.calls)}</td>
        <td class="num">${s.contextWindow ? compact(s.contextWindow) : '—'}</td>
        <td class="num">${fmtUSD(s.totals.cost)}</td>
        <td class="num">${s.totals.calls ? usagePct.toFixed(1) + '%' : '—'}</td>
        <td title="${ttl.title}">${ttlCell}</td>
        <td class="muted">${when}</td>
      </tr>`;
    }).join('') +
    '</tbody>');

  for (const tr of el('sessions-table').querySelectorAll('tr[data-id]')) {
    tr.style.cursor = 'pointer';
    tr.addEventListener('click', () => selectSession(decodeURIComponent(tr.dataset.id)));
  }
}

// `scroll` is opt-in: a user clicking a row wants to be taken to the chart,
// but the auto-selection on load should leave the page where it is.
async function selectSession(id, { scroll = true } = {}) {
  // A window into the previous session means nothing here; start from the
  // whole range. (A refresh of the *same* session deliberately keeps it, so a
  // live SSE update doesn't yank the view out from under a zoomed-in user.)
  if (id !== selectedId) detailZoom = null;
  selectedId = id;
  renderSessions();
  const res = await fetch(`/api/sessions/${encodeURIComponent(id)}`);
  if (!res.ok) return;
  const data = await res.json();
  renderSessionDetail(data.session, data.events);
  if (scroll) el('detail-card').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// Skip charts whose panel is collapsed — they'd measure 0 width and lay out
// wrong. The `toggle` handler re-renders them when they're expanded.
const panelOpen = (id) => {
  const panel = el(id)?.closest('.panel');
  return !panel || panel.open;
};

// `detail` opts out of the session breakdown for callers that are about to
// render it themselves from freshly fetched events — otherwise a refresh draws
// it twice, the first time from the stale cached payload.
function renderAll({ detail = true } = {}) {
  // The session breakdown rides along here so resize and theme changes re-lay
  // it out; it draws from the cached session payload, not from `stats`.
  if (detail && detailData && panelOpen('detail-chart')) {
    renderSessionDetail(detailData.session, detailData.events);
  }

  renderSessions();
}

async function refresh() {
  const [s, sess] = await Promise.all([
    fetch('/api/stats').then((r) => r.json()),
    fetch('/api/sessions').then((r) => r.json()),
  ]);
  stats = s;
  sessions = sess;

  // Open on the most recent session that actually has model calls, so the
  // breakdown panel is populated rather than empty on first paint. A session
  // that was resumed but never prompted has zero calls and nothing to chart.
  if (!selectedId) {
    const first = sessions.find((x) => x.totals.calls > 0);
    if (first) selectedId = first.sessionId;
  }

  // Two renders with a fetch between them, so each is anchored separately —
  // measuring across the await would compare against a layout that a paint has
  // already invalidated. `preserveScroll` is a no-op at the top of the page,
  // which is where a passive viewer usually sits.
  //
  // The breakdown is skipped in the first pass and drawn in the second, from
  // the events this refresh just fetched rather than the cached ones.
  preserveScroll(() => renderAll({ detail: !selectedId }));

  if (selectedId) {
    const res = await fetch(`/api/sessions/${encodeURIComponent(selectedId)}`);
    if (res.ok) {
      const data = await res.json();
      preserveScroll(() => renderSessionDetail(data.session, data.events));
    }
  }
}

function setLive(ok, text) {
  el('live-dot').className = 'dot' + (ok ? '' : ' stale');
  el('live-text').textContent = text;
}

// SSE keeps the page live; each batch triggers a debounced refetch of the
// aggregates rather than re-deriving them client-side.
let pending = null;
function connect() {
  const es = new EventSource('/stream');
  es.onopen = () => setLive(true, 'live');
  es.onmessage = () => {
    clearTimeout(pending);
    pending = setTimeout(() => {
      refresh().catch(() => {});
      setLive(true, 'live · updated ' + new Date().toLocaleTimeString());
    }, 400);
  };
  es.onerror = () => {
    setLive(false, 'reconnecting…');
    es.close();
    setTimeout(connect, 3000);
  };
}

// A chart rendered inside a collapsed <details> measures clientWidth as 0 and
// lays out wrong. Re-render on expand so a panel that was collapsed at load
// (or during a refresh) sizes itself correctly the first time it's opened.
for (const panel of document.querySelectorAll('.panel')) {
  panel.addEventListener('toggle', () => {
    if (!panel.open) return;
    if (panel.id === 'detail-card') {
      if (detailData) renderSessionDetail(detailData.session, detailData.events);
    } else if (stats) {
      renderAll();
    }
  });
}

el('detail-modes').addEventListener('click', (e) => {
  const mode = e.target.closest('button[data-mode]');
  if (mode) {
    if (mode.dataset.mode === detailMode) return;
    detailMode = mode.dataset.mode;
    if (detailData) renderSessionDetail(detailData.session, detailData.events);
    return;
  }

  const zoom = e.target.closest('button[data-zoom]');
  if (!zoom || !detailData) return;
  const n = detailCallCount();
  if (!n) return;

  // The buttons zoom around the middle of what's on screen — there is no
  // cursor to anchor to, unlike the wheel.
  const current = detailZoom || { start: 0, end: n };
  const span = current.end - current.start;
  const mid = (current.start + current.end) / 2;
  const next =
    zoom.dataset.zoom === 'reset' ? null
      : zoom.dataset.zoom === 'in' ? { start: mid - span / 4, end: mid + span / 4 }
        : { start: mid - span, end: mid + span };

  detailZoom = clampZoom(next, n);
  renderSessionDetail(detailData.session, detailData.events);
});

el('theme-toggle').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
  const next = current ? (current === 'dark' ? 'light' : 'dark') : (prefersDark ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', next);
  renderAll();
});

addEventListener('resize', () => { if (stats) renderAll(); });

// The chart is laid out for the height its host resolves to, but on the wide
// layout that height comes from the flex box *around* the SVG — so it isn't
// known until after a render has already happened. Watching the host closes
// the loop: opening the panel, collapsing a sibling, or any reflow that
// changes the leftover space redraws at the new size. Guarded on an actual
// change, since re-rendering is what resizes the host and would otherwise
// re-trigger this observer forever.
if (window.ResizeObserver) {
  // Observes the *card*, never the chart: the card's height comes from the grid
  // row, while the chart's comes from the SVG a render just drew. Watching the
  // chart would make every redraw retrigger the observer, and since each pass
  // re-measures the slack it would ratchet taller forever.
  const card = el('detail-card');
  let lastH = card.clientHeight;
  new ResizeObserver(() => {
    const h = card.clientHeight;
    if (Math.abs(h - lastH) < 1) return;
    lastH = h;
    if (detailData) renderSessionDetail(detailData.session, detailData.events);
  }).observe(card);
}

refresh().then(connect).catch(() => setLive(false, 'watcher unreachable'));
</script>
</body>
</html>
